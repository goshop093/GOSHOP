<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sneakers - Go Shop</title>
<style>
:root{
  --vino:#800020;
  --dark:#111;
}
*{box-sizing:border-box;}
body{
  background:#000;
  color:#fff;
  font-family:Arial,sans-serif;
  margin:0;
  padding:0;
  overflow-x:hidden;
}

/* HEADER */
header{
  position:fixed;
  top:0;
  width:100%;
  background:var(--dark);
  color:var(--vino);
  display:flex;
  justify-content:center;
  align-items:center;
  padding:14px;
  z-index:1000;
}
.cart-btn{
  position:absolute;
  right:15px;
  font-size:24px;
  cursor:pointer;
}
.cart-btn span{
  background:#000;
  padding:2px 6px;
  border-radius:50%;
  font-size:12px;
}

/* MAIN */
main{padding-top:90px;padding-bottom:90px}

/* PRODUCTOS */
.products{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
  gap:15px;
  padding:10px;
}
.card{
  background:var(--vino);
  color:#fff;
  border-radius:16px;
  padding:10px;
  position:relative;
}
.card img{
  width:100%;
  border-radius:10px;
}
.card select, .card button{
  width:100%;
  padding:8px;
  margin-top:5px;
  border:none;
  border-radius:8px;
  font-weight:bold;
  cursor:pointer;
}
.card select{
  background:#000;
  color:var(--vino);
}
.card button{
  background:#000;
  color:var(--vino);
}

/* SECCIONES */
h2{
  margin:20px 10px 10px 10px;
  color:var(--vino);
}

/* MOBILE BAR */
.mobile-bar{
  position:fixed;
  bottom:0;
  width:100%;
  background:#111;
  display:flex;
  justify-content:space-around;
  padding:10px 0;
}
.mobile-bar button{
  background:none;
  border:none;
  color:var(--vino);
  font-size:20px;
}
</style>
</head>
<body>

<header>
  <b>Go Shop - Sneakers</b>
  <div class="cart-btn" onclick="goCart()">🛒 <span id="cartCount">0</span></div>
</header>

<main>
  <h2>Nike</h2>
  <div id="products-nike" class="products"></div>

  <h2>Adidas</h2>
  <div id="products-adidas" class="products"></div>

  <h2>LV</h2>
  <div id="products-lv" class="products"></div>

  <h2>Alexander McQueen</h2>
  <div id="products-amq" class="products"></div>
</main>

<div class="mobile-bar">
  <button onclick="location.href='index.html'">🏠</button>
  <button onclick="goCart()">🛒</button>
  <button onclick="openWA()">💬</button>
</div>

<script>
// ===== Base completa de sneakers =====

  {name:"Billie Eilish x Nike Air Force 1 High “Mushroom”", cat:"Nike", img:"images/sneaker18.jpg"},
  {name:"ALYX x Nike Air Force 1", cat:"Nike", img:"images/sneaker19.jpg"},

  {name:"adidas Yeezy Boost 750 “Grey/Gum”", cat:"Adidas", img:"images/sneaker21.jpg"},

  {name:"EC1 T-Bar Sneaker Dark Brown", cat:"Alexander McQueen", img:"images/sneaker51.jpg"},
  {name:"Leather Sneakers Metallic Panel", cat:"Alexander McQueen", img:"images/sneaker52.jpg"},
  {name:"Tread Slick ‘Blush’", cat:"Alexander McQueen", img:"images/sneaker53.jpg"},
  {name:"Vintage Red Crystal Heel Sneaker", cat:"Alexander McQueen", img:"images/sneaker54.jpg"},
];

// Precio fijo
const PRICE = 159;

// ===== Carrito =====
let cart=JSON.parse(localStorage.getItem("cart"))||[];

// ===== Render =====
function render(){
  const nike = document.getElementById("products-nike");
  const adidas = document.getElementById("products-adidas");
  const lv = document.getElementById("products-lv");
  const amq = document.getElementById("products-amq");
  nike.innerHTML = adidas.innerHTML = lv.innerHTML = amq.innerHTML = "";

  sneakersData.forEach(i=>{
    const card = document.createElement("div");
    card.className="card";

    const sizes = ["6","7","8","9","10","11","12"];
    let selectHTML = `<select id="size-${i.name.replace(/\s/g,'')}">`;
    sizes.forEach(s=>{ selectHTML += `<option value="${s}">US ${s}</option>` });
    selectHTML += "</select>";

    card.innerHTML = `
      <img src="${i.img}">
      <b>${i.name}</b>
      <b>$${PRICE}</b>
      ${selectHTML}
      <button onclick='addCart("${i.name}","${i.cat}","${i.img}",document.getElementById("size-${i.name.replace(/\s/g,"")}").value)'>Agregar</button>
    `;

    if(i.cat==="Nike") nike.appendChild(card);
    else if(i.cat==="Adidas") adidas.appendChild(card);
    else if(i.cat==="LV") lv.appendChild(card);
    else if(i.cat==="Alexander McQueen") amq.appendChild(card);
  });
}

// ===== Agregar al carrito =====
function addCart(name, cat, img, size){
  const index = cart.findIndex(p=>p.name===name && p.size===size);
  if(index!==-1){
    cart[index].qty++;
  } else {
    cart.push({name, cat, img, size, qty:1, price:PRICE});
  }
  localStorage.setItem("cart",JSON.stringify(cart));
  updateCount();
  alert(`${name} US ${size} agregado al carrito`);
}

// ===== Contador =====
function updateCount(){
  document.getElementById("cartCount").innerText=cart.reduce((s,p)=>s+p.qty,0);
}

// ===== Funciones adicionales =====
function goCart(){location.href="pagina-del-carro.html";}
function openWA(){window.open("https://wa.me/13129348674","_blank");}

// ===== Inicializar =====
render();
updateCount();
</script>

</body>
</html>
