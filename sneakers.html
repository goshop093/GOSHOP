<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sneakers - Go Shop</title>
<style>
:root{
  --primary:#800000;
  --dark:#111;
  --bg:#000;
  --text:#fff;
}
*{box-sizing:border-box;}
body{background:var(--bg);color:var(--text);font-family:Arial,sans-serif;margin:0;padding:0;overflow-x:hidden;}
button{cursor:pointer;transition:.3s;}
button:hover{opacity:0.8;}
header{
  background:var(--dark);
  color:var(--primary);
  display:flex;
  justify-content:center;
  align-items:center;
  padding:14px;
  position:fixed;
  top:0;
  width:100%;
  z-index:1000;
  font-size:1.8rem;
}
header b{flex:1;text-align:center;}
.products{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:15px;padding:10px;margin-top:80px;}
.card{
  background:var(--dark);
  color:#fff;
  border-radius:16px;
  padding:10px;
  text-align:center;
}
.card img{width:100%;border-radius:10px;}
.card select, .card button{width:100%;margin-top:5px;padding:8px;border-radius:8px;border:none;font-weight:bold;}
.card select{background:#222;color:#fff;}
.card button{background:var(--primary);color:#fff;cursor:pointer;}
.mobile-bar{
  position:fixed;
  bottom:0;
  width:100%;
  background:var(--dark);
  display:flex;
  justify-content:space-around;
  padding:10px 0;
}
.mobile-bar button{background:none;border:none;color:var(--primary);font-size:20px;}
</style>
</head>
<body>

<header>
  <b>Go Shop - Sneakers</b>
</header>

<main id="products" class="products"></main>

<div class="mobile-bar">
  <button onclick="location.href='index.html'">🏠</button>
  <button onclick="goCart()">🛒</button>
  <button onclick="openWA()">💬</button>
</div>

<script>
// ===== Datos sneakers =====
const sneakers = [

  {name:"Air Jordan 4 Retro ‘Black Cat’", cat:"Nike", img:"images/sneaker8.jpg"},
  {name:"Nike x Louis Vuitton Air Force 1", cat:"Nike", img:"images/sneaker9.jpg"},
  {name:"VLONE x Nike Air Force 1 High “Paris Fashion Week”", cat:"Nike", img:"images/sneaker10.jpg"},
  {name:"CLOT x Nike Air Force 1 “1World”", cat:"Nike", img:"images/sneaker11.jpg"},
  {name:"Tiffany & Co. x Nike Air Force 1", cat:"Nike", img:"images/sneaker12.jpg"},
  {name:"KAWS x Nike Air Force 1 “1World”", cat:"Nike", img:"images/sneaker13.jpg"},
  {name:"Nike x PlayStation Air Force 1", cat:"Nike", img:"images/sneaker14.jpg"},
  {name:"UNDEFEATED x Nike Air Force 1", cat:"Nike", img:"images/sneaker15.jpg"},
  {name:"Off-White x Nike Air Force 1", cat:"Nike", img:"images/sneaker16.jpg"},
  {name:"Travis Scott x Nike Air Force 1", cat:"Nike", img:"images/sneaker17.jpg"},
  {name:"Billie Eilish x Nike Air Force 1 High “Mushroom”", cat:"Nike", img:"images/sneaker18.jpg"},
  {name:"ALYX x Nike Air Force 1", cat:"Nike", img:"images/sneaker19.jpg"},
  {name:"Nike x Rocafella Air Force 1", cat:"Nike", img:"images/sneaker20.jpg"},
  {name:"adidas Yeezy Boost 750 “Grey/Gum”", cat:"Adidas", img:"images/sneaker21.jpg"},

  {name:"adidas NMD_R1 “Friends and Family”", cat:"Adidas", img:"images/sneaker24.jpg"},
  {name:"adidas Pharrell Williams Human Race NMD", cat:"Adidas", img:"images/sneaker25.jpg"},
  {name:"adidas Parley for the Oceans Ultra Boost Uncaged", cat:"Adidas", img:"images/sneaker26.jpg"},
  {name:"adidas Ultra Boost", cat:"Adidas", img:"images/sneaker27.jpg"},

  {name:"adidas x Prada Superstar / Luna Rossa", cat:"Adidas", img:"images/sneaker29.jpg"},
  {name:"adidas x Yohji Yamamoto Y-3 Qasa High", cat:"Adidas", img:"images/sneaker30.jpg"},

  {name:"Oversized Sneaker White/Red Tartan", cat:"Alexander McQueen", img:"images/sneaker36.jpg"},

  {name:"Sprint Runner Sneakers", cat:"Alexander McQueen", img:"images/sneaker39.jpg"},
  {name:"EC1 Sneaker White", cat:"Alexander McQueen", img:"images/sneaker40.jpg"},
  {name:"EC1 T-Bar Sneaker Dark Brown", cat:"Alexander McQueen", img:"images/sneaker41.jpg"},
  {name:"Leather Sneakers Metallic Panel", cat:"Alexander McQueen", img:"images/sneaker42.jpg"},
  {name:"Tread Slick ‘Blush’", cat:"Alexander McQueen", img:"images/sneaker43.jpg"},
  {name:"Vintage Red Crystal Heel Sneaker", cat:"Alexander McQueen", img:"images/sneaker44.jpg"}
];

// ===== Tamaños disponibles =====
const sizesUS = ["US 6","US 7","US 8","US 9","US 10","US 11","US 12"];

// ===== Carrito =====
let cart = JSON.parse(localStorage.getItem("cart")) || [];

// ===== Render sneakers =====
function renderSneakers(){
  const container = document.getElementById("products");
  container.innerHTML = "";
  sneakers.forEach((s,i)=>{
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `
      <img src="${s.img}" alt="${s.name}">
      <b>${s.name}</b>
      <select id="size-${i}">
        <option value="">Selecciona talla</option>
        ${sizesUS.map(sz=>`<option value="${sz}">${sz}</option>`).join('')}
      </select>
      <b>$159</b>
      <button onclick='addToCart(${i})'>Agregar</button>
    `;
    container.appendChild(card);
  });
}

// ===== Agregar al carrito =====
function addToCart(index){
  const selectedSize = document.getElementById(`size-${index}`).value;
  if(!selectedSize){ alert("Selecciona una talla"); return; }

  const item = {...sneakers[index], price:159, size:selectedSize};
  // Verifica si existe el mismo producto con la misma talla
  const existing = cart.find(p => p.name===item.name && p.size===item.size);
  if(existing){
    existing.qty++;
  } else {
    cart.push({...item, qty:1});
  }

  localStorage.setItem("cart", JSON.stringify(cart));
  updateCount();
}

// ===== Contador carrito =====
function updateCount(){
  document.getElementById("cartCount") ? 
    document.getElementById("cartCount").innerText = cart.reduce((a,b)=>a+b.qty,0) 
    : null;
}

// ===== Funciones extras =====
function goCart(){ location.href="pagina-del-carro.html"; }
function openWA(){ window.open("https://wa.me/13129348674","_blank"); }

// ===== Inicializar =====
renderSneakers();
updateCount();
</script>

</body>
</html>
