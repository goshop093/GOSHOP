<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Go Shop</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <div class="menu-btn" onclick="toggleMenu()">☰</div>
  <b>Go Shop</b>
  <div class="cart-btn" onclick="goCart()">🛒 <span id="cartCount">0</span></div>
</header>

<!-- MENÚ LATERAL -->
<div class="side-menu" id="menu">
  <button onclick="filterCategory('Perfumes')">Perfumes</button>
  <button onclick="filterCategory('Sneakers')">Sneakers</button>
  <button onclick="filterCategory('Relojes')">Relojes</button>
  <button onclick="showFavs()">❤️ Favoritos</button>
  <button onclick="openWA()">💬 Contacto</button>
</div>

<!-- BANNER -->
<section class="banner">
  <img src="images/banner.jpg" alt="Banner Go Shop">
</section>

<!-- BARRAS DE CATEGORÍAS -->
<section class="categories">
  <button onclick="goCategory('perfumes.html')">Perfumes</button>
  <button onclick="goCategory('sneakers.html')">Sneakers</button>
  <button onclick="goCategory('relojes.html')">Relojes</button>
</section>

<!-- CARRUSELES DESTACADOS -->
<main>
  <h2>Perfumes Destacados</h2>
  <div class="carousel" id="perfumesCarousel"></div>

  <h2>Sneakers Destacados</h2>
  <div class="carousel" id="sneakersCarousel"></div>

  <h2>Relojes Destacados</h2>
  <div class="carousel" id="relojesCarousel"></div>
</main>

<!-- BUSCADOR FLOTANTE -->
<div class="search-fab" onclick="toggleSearch()">🔍</div>
<div class="search-box" id="searchBox">
  <input type="text" placeholder="Buscar..." oninput="searchProducts(this.value)">
</div>

<div class="mobile-bar">
  <button onclick="location.reload()">🏠</button>
  <button onclick="goCart()">🛒</button>
  <button onclick="openWA()">💬</button>
</div>

<script src="script.js"></script>
</body>
</html>
