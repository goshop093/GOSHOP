<title>Perfumes - Go Shop</title>
<style>
:root{
  --vino:#800020;
  --dark:#111;
}
*{box-sizing:border-box;}
body{
  background:#000;
  color:#fff;
  font-family:Arial,sans-serif;
  margin:0;
  padding:0;
  overflow-x:hidden;
}

/* HEADER */
header{
  position:fixed;
  top:0;
  width:100%;
  background:var(--dark);
  color:var(--vino);
  display:flex;
  justify-content:center;
  align-items:center;
  padding:14px;
  z-index:1000;
}
.menu-btn,.cart-btn{
  position:absolute;
  font-size:24px;
  cursor:pointer;
}
.menu-btn{left:15px}
.cart-btn{right:15px}
.cart-btn span{
  background:#000;
  padding:2px 6px;
  border-radius:50%;
  font-size:12px;
}

/* MAIN */
main{padding-top:90px;padding-bottom:90px}

/* PRODUCTOS */
.products{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
  gap:15px;
  padding:10px;
}
.card{
  background:var(--vino);
  color:#fff;
  border-radius:16px;
  padding:10px;
  position:relative;
}
.card img{
  width:100%;
  border-radius:10px;
}
.card button{
  width:100%;
  padding:8px;
  border:none;
  border-radius:8px;
  background:#000;
  color:var(--vino);
  font-weight:bold;
  cursor:pointer;
}
.card .mayoreo{
  font-size:11px;
  font-weight:bold;
  margin:4px 0;
  color:#00ff9c;
}

/* SECCIONES */
h2{
  margin:20px 10px 10px 10px;
  color:var(--vino);
}

/* MOBILE BAR */
.mobile-bar{
  position:fixed;
  bottom:0;
  width:100%;
  background:#111;
  display:flex;
  justify-content:space-around;
  padding:10px 0;
}
.mobile-bar button{
  background:none;
  border:none;
  color:var(--vino);
  font-size:20px;
}

/* ANIMACIÓN */
@keyframes fadeUp{
  from{opacity:0;transform:translateY(15px)}
  to{opacity:1;transform:translateY(0)}
}
</style>
</head>

// ===== Carrito =====
let cart=JSON.parse(localStorage.getItem("cart"))||[];

// ===== Mayoreo =====
function getMayoreoPrice(qty, base){
  if(qty>=10) return 500;
  if(qty>=5) return 300;
  return base * qty;
}

// ===== Render =====
function render(){
  const hombres = document.getElementById("products-hombre");
  const mujeres = document.getElementById("products-mujer");
  hombres.innerHTML = "";
  mujeres.innerHTML = "";

  data.forEach(i=>{
    const card = `
    <div class="card">
      <img src="${i.img}">
      <b>${i.name}</b>
      <div class="mayoreo">5 pcs → $250 · 10 pcs → $450</div>
      <b>$${i.price}</b>
      <button onclick='addCart(${JSON.stringify(i)})'>Agregar</button>
    </div>`;
    
    if(i.cat.toLowerCase().includes("hombre")) hombres.innerHTML += card;
    else mujeres.innerHTML += card;
  });
}

// ===== Agregar al carrito =====
function addCart(i){
  const index = cart.findIndex(p=>p.name===i.name);
  if(index!==-1){
    cart[index].qty++;
    cart[index].priceFinal = getMayoreoPrice(cart[index].qty,i.price);
  } else {
    cart.push({...i, qty:1, priceFinal:i.price});
  }
  localStorage.setItem("cart",JSON.stringify(cart));
  updateCount();
}

// ===== Contador =====
function updateCount(){
  document.getElementById("cartCount").innerText=cart.reduce((s,p)=>s+p.qty,0);
}

// ===== Funciones adicionales =====
function goCart(){location.href="pagina-del-carro.html";}
function openWA(){window.open("https://wa.me/13129348674","_blank");}

// ===== Inicializar =====
render();
updateCount();
