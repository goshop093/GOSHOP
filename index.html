<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Go Shop</title>
<style>
/* ================= BODY ================= */
body {
  background-color: #000;
  font-family: Arial, sans-serif;
  margin: 0;
  padding: 0;
  color: #fff;
  text-align: center;
}

/* ================= HEADER ================= */
header {
  background: #111;
  color: #FFD700;
  padding: 16px;
  font-size: 1.8rem;
  position: fixed;
  top: 0;
  width: 100%;
  z-index: 1000;
}
header b { flex: 1; }
.menu-btn, .cart-btn {
  position: absolute;
  top: 16px;
  font-size: 26px;
  cursor: pointer;
  color: #FFD700;
}
.menu-btn { left: 16px; }
.cart-btn { right: 16px; }
.cart-btn span {
  background: #000;
  color: #FFD700;
  padding: 2px 7px;
  border-radius: 50%;
  font-size: 14px;
  vertical-align: super;
}

/* ================= SECCIONES HORIZONTALES ================= */
.section-title {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin: 70px 20px 10px 20px;
  font-size: 1.4rem;
  color: #FFD700;
}
.section-title button {
  background: #000;
  color: #FFD700;
  border: none;
  padding: 5px 12px;
  border-radius: 6px;
  cursor: pointer;
}
.section-title button:hover { background: #222; }

.scroll-container {
  display: flex;
  overflow-x: auto;
  gap: 10px;
  padding: 10px 20px;
  scroll-behavior: smooth;
}
.scroll-container::-webkit-scrollbar {
  height: 8px;
}
.scroll-container::-webkit-scrollbar-thumb {
  background: #FFD700;
  border-radius: 4px;
}
.scroll-container::-webkit-scrollbar-track { background: #111; }

/* ================= PRODUCT CARDS ================= */
.product-card {
  min-width: 140px;
  max-width: 140px;
  background: #FFD700;
  border-radius: 12px;
  padding: 8px;
  box-shadow: 0 6px 15px rgba(0,0,0,0.3);
  text-align: center;
  flex-shrink: 0;
}
.product-card img {
  width: 100%;
  height: 100px;
  object-fit: cover;
  border-radius: 8px;
}
.product-card h3 {
  font-size: 0.85rem;
  margin: 5px 0 2px 0;
}
.product-card p {
  font-size: 0.75rem;
  margin: 2px 0 5px 0;
}
.product-card button {
  font-size: 0.7rem;
  padding: 5px 8px;
  background: #000;
  color: #FFD700;
  border: none;
  border-radius: 5px;
  cursor: pointer;
}
.product-card button:hover { background: #222; }

/* ================= MOBILE BAR ================= */
.mobile-bar {
  position: fixed;
  bottom: 0;
  width: 100%;
  background: #111;
  display: flex;
  justify-content: space-around;
  padding: 10px 0;
  z-index: 1000;
}
.mobile-bar button {
  background: none;
  border: none;
  color: #FFD700;
  font-size: 1.5rem;
  cursor: pointer;
}

/* ================= RESPONSIVE ================= */
@media screen and (max-width:600px) {
  .product-card { min-width: 120px; max-width: 120px; }
  .product-card img { height: 90px; }
}
</style>
</head>
<body>

<header>
  <div class="menu-btn" onclick="toggleMenu()">☰</div>
  <b>Go Shop</b>
  <div class="cart-btn" onclick="goCart()">🛒 <span id="cartCount">0</span></div>
</header>

<main style="padding-top:80px; padding-bottom:80px;">

  <!-- PERFUMES -->
  <div class="section-title">
    <span>Perfumes Exclusivos</span>
    <button onclick="location.href='perfumes.html'">Ver todos</button>
  </div>
  <div class="scroll-container" id="perfumes-container"></div>

  <!-- SNEAKERS -->
  <div class="section-title">
    <span>Sneakers Exclusivos</span>
    <button onclick="location.href='sneakers.html'">Ver todos</button>
  </div>
  <div class="scroll-container" id="sneakers-container"></div>

  <!-- RELOJES -->
  <div class="section-title">
    <span>Relojes Exclusivos</span>
    <button onclick="location.href='relojes.html'">Ver todos</button>
  </div>
  <div class="scroll-container" id="relojes-container"></div>

</main>

<div class="mobile-bar">
  <button onclick="location.reload()">🏠</button>
  <button onclick="goCart()">🛒</button>
  <button onclick="openWA()">💬</button>
</div>

<script>
// ====== DATOS EJEMPLO ======
const perfumes = [
  {name:"Valentino", price:80, img:"images/perfume1.jpg"},
  {name:"Dior J’adore", price:80, img:"images/perfume18.jpg"},
  {name:"Creed Aventus", price:80, img:"images/perfume6.jpg"},
  {name:"Tom Ford Oud Wood", price:80, img:"images/perfume25.jpg"},
  {name:"Versace Eros", price:80, img:"images/perfume40.jpg"},
  {name:"Gucci Bloom", price:80, img:"images/perfume39.jpg"},
  {name:"YSL Black Opium", price:80, img:"images/perfume58.jpg"},
  {name:"Bleu De Chanel", price:80, img:"images/perfume29.jpg"},
  {name:"One Million", price:80, img:"images/perfume27.jpg"},
  {name:"Baccarat Rouge 540", price:80, img:"images/perfume75.jpg"}
];

const sneakers = [
  {name:"Air Jordan 1", price:250, img:"images/sneaker1.jpg"},
  {name:"Air Jordan 4", price:300, img:"images/sneaker2.jpg"},
  {name:"Nike AF1 Off-White", price:350, img:"images/sneaker3.jpg"},
  {name:"Yeezy Boost 350", price:400, img:"images/sneaker4.jpg"},
  {name:"Nike Dunk Low", price:220, img:"images/sneaker5.jpg"},
  {name:"Puma RS-X", price:180, img:"images/sneaker6.jpg"},
  {name:"Reebok Question", price:200, img:"images/sneaker7.jpg"},
  {name:"Converse Chuck 70", price:150, img:"images/sneaker8.jpg"},
  {name:"New Balance 990", price:210, img:"images/sneaker9.jpg"},
  {name:"Adidas Forum Low", price:190, img:"images/sneaker10.jpg"}
];

const relojes = [
  {name:"Rolex Submariner", price:12000, img:"images/reloj1.jpg"},
  {name:"Omega Seamaster", price:9500, img:"images/reloj2.jpg"},
  {name:"Tag Heuer Carrera", price:7000, img:"images/reloj3.jpg"},
  {name:"Audemars Piguet Royal Oak", price:45000, img:"images/reloj4.jpg"},
  {name:"Patek Philippe Nautilus", price:60000, img:"images/reloj5.jpg"},
  {name:"Breitling Navitimer", price:8000, img:"images/reloj6.jpg"},
  {name:"Hublot Big Bang", price:25000, img:"images/reloj7.jpg"},
  {name:"Cartier Santos", price:11000, img:"images/reloj8.jpg"},
  {name:"Seiko Prospex", price:900, img:"images/reloj9.jpg"},
  {name:"Casio G-Shock", price:150, img:"images/reloj10.jpg"}
];

// ====== CARRITO ======
let cart = JSON.parse(localStorage.getItem("cart")) || [];

function updateCount(){
  document.getElementById("cartCount").innerText = cart.reduce((s,p)=>s+p.qty||1,0);
}

// ====== RENDER SECCIONES ======
function renderSection(containerId, items){
  const container = document.getElementById(containerId);
  container.innerHTML = "";
  items.forEach(i=>{
    const card = document.createElement("div");
    card.className = "product-card";
    card.innerHTML = `
      <img src="${i.img}" alt="${i.name}">
      <h3>${i.name}</h3>
      <p>$${i.price}</p>
      <button onclick='addCart(${JSON.stringify(i)})'>Agregar</button>
    `;
    container.appendChild(card);
  });
}

// ====== FUNCIONES CARRITO ======
function addCart(item){
  const index = cart.findIndex(p=>p.name===item.name);
  if(index!==-1) cart[index].qty++;
  else cart.push({...item, qty:1});
  localStorage.setItem("cart",JSON.stringify(cart));
  updateCount();
  alert(`${item.name} agregado al carrito`);
}

function goCart(){ location.href='pagina-del-carro.html'; }
function openWA(){ window.open("https://wa.me/13129348674","_blank"); }

// ====== INICIALIZAR ======
renderSection("perfumes-container", perfumes);
renderSection("sneakers-container", sneakers);
renderSection("relojes-container", relojes);
updateCount();
</script>

</body>
</html>
