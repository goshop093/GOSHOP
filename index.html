<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Go Shop</title>
<style>
:root{
  --primary:#800000; /* rojo vino */
  --dark:#111;
  --bg:#000;
  --card-bg:#2c0000; /* un poco más oscuro que el rojo vino */
}

body{
  margin:0;
  font-family:Arial, sans-serif;
  background:var(--bg);
  color:#fff;
  overflow-x:hidden;
}

/* HEADER */
header{
  position:fixed;
  top:0;
  width:100%;
  background:var(--dark);
  color:var(--primary);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:14px;
  font-size:1.5rem;
  z-index:1000;
}
.menu-btn, .cart-btn{
  position:absolute;
  font-size:24px;
  cursor:pointer;
}
.menu-btn{left:15px;}
.cart-btn{right:15px;}
.cart-btn span{
  background:var(--bg);
  padding:2px 6px;
  border-radius:50%;
  font-size:12px;
}

/* SIDE MENU */
.side-menu{
  position:fixed;
  top:0;
  left:-260px;
  width:260px;
  height:100%;
  background:var(--dark);
  padding:20px;
  transition:left 0.3s;
  z-index:2000;
}
.side-menu button{
  width:100%;
  background:var(--bg);
  color:var(--primary);
  border:none;
  padding:12px;
  border-radius:10px;
  margin-bottom:10px;
  font-weight:bold;
}
.submenu{display:none; margin-left:10px;}

/* BUSCADOR */
.search-fab{
  position:fixed;
  bottom:90px;
  right:20px;
  background:var(--primary);
  color:#fff;
  width:55px;
  height:55px;
  border-radius:50%;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:22px;
  cursor:pointer;
  z-index:3000;
}
.search-box{
  position:fixed;
  bottom:160px;
  right:20px;
  width:0;
  overflow:hidden;
  transition:0.3s;
}
.search-box input{
  width:220px;
  padding:12px;
  border-radius:25px;
  border:none;
}

/* SECCIONES */
.section-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:10px 15px;
  font-size:1.3rem;
  color:var(--primary);
}
.section-title button{
  background:#000;
  color:var(--primary);
  border:none;
  padding:4px 10px;
  border-radius:6px;
  font-weight:bold;
  cursor:pointer;
}

/* SCROLL HORIZONTAL */
.horizontal-scroll{
  display:flex;
  overflow-x:auto;
  padding:10px;
  gap:10px;
  scroll-behavior: smooth;
}
.horizontal-scroll::-webkit-scrollbar{
  height:6px;
}
.horizontal-scroll::-webkit-scrollbar-thumb{
  background:var(--primary);
  border-radius:10px;
}

/* TARJETAS ESTILO APP */
.card{
  min-width:120px;
  background:var(--card-bg);
  color:#fff;
  border-radius:15px;
  padding:8px;
  text-align:center;
  flex-shrink:0;
  transition:transform 0.2s;
}
.card:hover{
  transform:scale(1.05);
}
.card img{
  width:100%;
  border-radius:10px;
  height:120px;
  object-fit:cover;
  margin-bottom:5px;
}
.card b{
  display:block;
  font-size:0.9rem;
  margin-bottom:5px;
}
.card button{
  width:100%;
  padding:5px;
  border:none;
  border-radius:8px;
  background:#000;
  color:var(--primary);
  cursor:pointer;
  font-weight:bold;
  font-size:0.85rem;
}

/* MOBILE BAR */
.mobile-bar{
  position:fixed;
  bottom:0;
  width:100%;
  display:flex;
  justify-content:space-around;
  padding:10px 0;
  background:var(--dark);
}
.mobile-bar button{
  background:none;
  border:none;
  color:var(--primary);
  font-size:22px;
}

/* ANIMACION */
@keyframes fadeUp{
  from{opacity:0; transform:translateY(15px);}
  to{opacity:1; transform:translateY(0);}
}

/* RESPONSIVE */
@media screen and (max-width:600px){
  .card{
    min-width:100px;
    height:auto;
  }
  .card img{ height:100px; }
  .section-title{ font-size:1.1rem; padding:8px 10px;}
  .horizontal-scroll{gap:5px; padding:5px;}
}
</style>
</head>
<body>

<header>
  <div class="menu-btn" onclick="toggleMenu()">☰</div>
  <b>Go Shop</b>
  <div class="cart-btn" onclick="goCart()">🛒 <span id="cartCount">0</span></div>
</header>

<!-- MENÚ LATERAL -->
<div class="side-menu" id="menu">
  <button onclick="toggleSub()">Productos ▸</button>
  <div class="submenu" id="submenu">
    <button onclick="location.href='perfumes.html'">Perfumes</button>
    <button onclick="location.href='sneakers.html'">Sneakers</button>
    <button onclick="location.href='relojes.html'">Relojes</button>
  </div>
  <button onclick="showFavs()">❤️ Favoritos</button>
  <button onclick="openWA()">💬 Contacto</button>
</div>

<!-- BUSCADOR -->
<div class="search-fab" onclick="toggleSearch()">🔍</div>
<div class="search-box" id="searchBox">
  <input type="text" placeholder="Buscar..." oninput="search(this.value)">
</div>

<main style="padding-top:90px; padding-bottom:90px">

  <div class="section-title">
    Perfumes
    <button onclick="location.href='perfumes.html'">Ver todos</button>
  </div>
  <div class="horizontal-scroll" id="perfumes"></div>

  <div class="section-title">
    Sneakers
    <button onclick="location.href='sneakers.html'">Ver todos</button>
  </div>
  <div class="horizontal-scroll" id="sneakers"></div>

  <div class="section-title">
    Relojes
    <button onclick="location.href='relojes.html'">Ver todos</button>
  </div>
  <div class="horizontal-scroll" id="relojes"></div>

</main>

<!-- MOBILE BAR -->
<div class="mobile-bar">
  <button onclick="location.reload()">🏠</button>
  <button onclick="goCart()">🛒</button>
  <button onclick="openWA()">💬</button>
</div>

<script>
let cart = JSON.parse(localStorage.getItem("cart")) || [];

// Contador del carrito
function updateCount(){
  document.getElementById("cartCount").innerText = cart.reduce((a,b)=>a+b.qty,0);
}

// Agregar al carrito
function addCart(name,img,price=80){
  const index = cart.findIndex(p => p.name === name);
  if(index!==-1){
    cart[index].qty++;
  } else {
    cart.push({name,img,qty:1,price});
  }
  localStorage.setItem("cart",JSON.stringify(cart));
  updateCount();
  alert(name + " agregado al carrito");
}

// Render secciones horizontales
function renderSection(id,data){
  const container = document.getElementById(id);
  container.innerHTML = "";
  data.forEach(item=>{
    const card = document.createElement("div");
    card.className="card";
    card.innerHTML = `
      <img src="${item.img}" alt="${item.name}">
      <b>${item.name}</b>
      <button onclick='addCart("${item.name}","${item.img}",80)'>Agregar</button>
    `;
    container.appendChild(card);
  });
}

// Menu y buscador
function toggleMenu(){
  const menu = document.getElementById("menu");
  menu.style.left = (menu.style.left === "0px") ? "-260px" : "0px";
}
function toggleSub(){
  const s=document.getElementById("submenu");
  s.style.display = (s.style.display==="block") ? "none" : "block";
}
function toggleSearch(){
  const b=document.getElementById("searchBox");
  b.style.width = (b.style.width==="220px") ? "0" : "220px";
}
function goCart(){ location.href="pagina-del-carro.html"; }
function openWA(){ window.open("https://wa.me/13129348674","_blank"); }
function search(t){ console.log("Buscar: ",t); }
function showFavs(){ alert("Función de favoritos aún no implementada"); }

// Datos de ejemplo
const perfumesData=[
  {name:"Valentino",img:"images/perfume1.jpg"},
  {name:"JPG Scandal",img:"images/perfume10.jpg"},
  {name:"Dior",img:"images/perfume3.jpg"},
  {name:"Creed Aventus",img:"images/perfume6.jpg"},
  {name:"Tom Ford Lost Cherry",img:"images/perfume33.jpg"},
  {name:"Versace Eros",img:"images/perfume40.jpg"},
  {name:"Gucci Bloom",img:"images/perfume39.jpg"},
  {name:"YSL Eau de Parfum",img:"images/perfume8.jpg"},
  {name:"Invictus",img:"images/perfume2.jpg"},
  {name:"Bleu De Chanel Parfum",img:"images/perfume29.jpg"}
];

const sneakersData=[
  {name:"Jordan 4 Black Cat",img:"images/jordan4blackcat.jpg"},
  {name:"Nike Air Force 1",img:"images/af1.jpg"},
  {name:"Adidas Yeezy",img:"images/yeezy.jpg"},
  {name:"Air Jordan 1",img:"images/jordan1.jpg"},
  {name:"Nike Dunk Low",img:"images/dunklow.jpg"},
  {name:"New Balance 550",img:"images/nb550.jpg"},
  {name:"Puma RS-X",img:"images/pumarsx.jpg"},
  {name:"Reebok Question",img:"images/reebokquestion.jpg"},
  {name:"Asics Gel Lyte",img:"images/asicsgel.jpg"},
  {name:"Converse Chuck 70",img:"images/converse70.jpg"}
];

const relojesData=[
  {name:"Rolex Submariner",img:"images/rolex1.jpg"},
  {name:"Omega Seamaster",img:"images/omega1.jpg"},
  {name:"Tag Heuer Carrera",img:"images/tag1.jpg"},
  {name:"Audemars Piguet Royal Oak",img:"images/ap1.jpg"},
  {name:"Cartier Santos",img:"images/cartier1.jpg"},
  {name:"Hublot Big Bang",img:"images/hublot1.jpg"},
  {name:"Tissot PRX",img:"images/tissot1.jpg"},
  {name:"Seiko Prospex",img:"images/seiko1.jpg"},
  {name:"Casio G-Shock",img:"images/casio1.jpg"},
  {name:"Fossil Machine",img:"images/fossil1.jpg"}
];

// Inicializar
renderSection("perfumes",perfumesData);
renderSection("sneakers",sneakersData);
renderSection("relojes",relojesData);
updateCount();
</script>

</body>
</html>
