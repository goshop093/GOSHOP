<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Go Shop</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header>
  <div class="menu-btn" onclick="toggleMenu()">☰</div>
  <b>Go Shop</b>
  <div class="cart-btn" onclick="goCart()">🛒 <span id="cartCount">0</span></div>
</header>

<!-- MENÚ LATERAL -->
<div class="side-menu" id="menu">
  <button onclick="toggleSub()">Productos ▸</button>
  <div class="submenu" id="submenu">
    <button onclick="location.href='perfumes.html'">Perfumes</button>
    <button onclick="location.href='sneakers.html'">Sneakers</button>
    <button onclick="location.href='relojes.html'">Relojes</button>
  </div>
  <button onclick="showFavs()">❤️ Favoritos</button>
  <button onclick="openWA()">💬 Contacto</button>
</div>

<!-- BUSCADOR -->
<div class="search-fab" onclick="toggleSearch()">🔍</div>
<div class="search-box" id="searchBox">
  <input type="text" placeholder="Buscar..." oninput="search(this.value)">
</div>

<main style="padding-top:90px; padding-bottom:90px">

  <div class="section-title">
    Perfumes
    <button onclick="location.href='perfumes.html'">Ver todos</button>
  </div>
  <div class="horizontal-scroll" id="perfumes"></div>

  <div class="section-title">
    Sneakers
    <button onclick="location.href='sneakers.html'">Ver todos</button>
  </div>
  <div class="horizontal-scroll" id="sneakers"></div>

  <div class="section-title">
    Relojes
    <button onclick="location.href='relojes.html'">Ver todos</button>
  </div>
  <div class="horizontal-scroll" id="relojes"></div>

</main>

<!-- MOBILE BAR -->
<div class="mobile-bar">
  <button onclick="location.reload()">🏠</button>
  <button onclick="goCart()">🛒</button>
  <button onclick="openWA()">💬</button>
</div>

<script>
let cart = JSON.parse(localStorage.getItem("cart")) || [];

// Contador del carrito
function updateCount(){
  document.getElementById("cartCount").innerText = cart.reduce((a,b)=>a+b.qty,0);
}

// Agregar al carrito
function addCart(name,img,price=80){
  const index = cart.findIndex(p => p.name === name);
  if(index !== -1){
    cart[index].qty++;
  } else {
    cart.push({name,img,qty:1,price});
  }
  localStorage.setItem("cart",JSON.stringify(cart));
  updateCount();
  alert(name + " agregado al carrito");
}

// Render secciones horizontales
function renderSection(id,data){
  const container = document.getElementById(id);
  container.innerHTML = "";
  data.forEach(item=>{
    const card = document.createElement("div");
    card.className="card";
    card.innerHTML = `
      <img src="${item.img}" alt="${item.name}">
      <b>${item.name}</b>
      <button onclick='addCart("${item.name}","${item.img}",80)'>Agregar</button>
    `;
    container.appendChild(card);
  });
}

// Menú lateral
function toggleMenu(){
  const menu = document.getElementById("menu");
  if(menu.style.left === "0px") menu.style.left = "-260px";
  else menu.style.left = "0px";
}
function toggleSub(){
  const s=document.getElementById("submenu");
  s.style.display = (s.style.display==="block") ? "none" : "block";
}

// Buscador
function toggleSearch(){
  const b = document.getElementById("searchBox");
  b.style.width = (b.style.width==="220px") ? "0" : "220px";
}

function goCart(){ location.href="pagina-del-carro.html"; }
function openWA(){ window.open("https://wa.me/13129348674","_blank"); }
function search(t){ console.log("Buscar: ",t); }
function showFavs(){ alert("Función de favoritos aún no implementada"); }

// Datos de ejemplo
const perfumesData=[
  {name:"Valentino",img:"images/perfume1.jpg"},
  {name:"JPG Scandal",img:"images/perfume10.jpg"},
  {name:"Dior",img:"images/perfume3.jpg"},
  {name:"Creed Aventus",img:"images/perfume6.jpg"},
  {name:"Tom Ford Lost Cherry",img:"images/perfume33.jpg"},
  {name:"Versace Eros",img:"images/perfume40.jpg"},
  {name:"Gucci Bloom",img:"images/perfume39.jpg"},

];

const sneakersData=[
  {name:"Jordan 4 Black Cat",img:"images/jordan4blackcat.jpg"},
  {name:"Nike Air Force 1",img:"images/af1.jpg"},
  {name:"Adidas Yeezy",img:"images/yeezy.jpg"},
  {name:"Air Jordan 1",img:"images/jordan1.jpg"},
  {name:"Nike Dunk Low",img:"images/dunklow.jpg"},
  {name:"New Balance 550",img:"images/nb550.jpg"},

const relojesData=[
  {name:"Rolex Submariner",img:"images/rolex1.jpg"},

// Inicializar secciones
renderSection("perfumes",perfumesData);

updateCount();
</script>

</body>
</html>
