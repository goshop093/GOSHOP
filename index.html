<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Go Shop</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{
  --gold:#FFD700;
  --dark:#111;
}
*{box-sizing:border-box}

body{
  background:#000;
  color:#fff;
  font-family:Arial, sans-serif;
  margin:0;
  overflow-x:hidden;
}

/* ===== HEADER ===== */
header{
  position:fixed;
  top:0;
  width:100%;
  background:var(--dark);
  color:var(--gold);
  display:flex;
  justify-content:center;
  align-items:center;
  padding:14px;
  z-index:1000;
}
.menu-btn,.cart-btn{
  position:absolute;
  font-size:24px;
  cursor:pointer;
}
.menu-btn{left:15px}
.cart-btn{right:15px}
.cart-btn span{
  background:#000;
  padding:2px 6px;
  border-radius:50%;
  font-size:12px;
}

/* ===== MAIN ===== */
main{padding-top:90px;padding-bottom:90px}

/* ===== MENÚ LATERAL ===== */
.side-menu{
  position:fixed;
  left:-260px;
  top:0;
  width:260px;
  height:100%;
  background:#111;
  padding:20px;
  transition:.3s;
  z-index:2000;
}
.side-menu button{
  width:100%;
  background:#000;
  color:var(--gold);
  border:none;
  padding:12px;
  border-radius:10px;
  margin-bottom:10px;
  font-weight:bold;
}
.submenu{display:none;margin-left:10px}

/* ===== BUSCADOR FLOTANTE ===== */
.search-fab{
  position:fixed;
  bottom:90px;
  right:20px;
  background:var(--gold);
  color:#000;
  width:55px;
  height:55px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:22px;
  z-index:3000;
  cursor:pointer;
}
.search-box{
  position:fixed;
  bottom:160px;
  right:20px;
  width:0;
  overflow:hidden;
  transition:.3s;
}
.search-box input{
  width:220px;
  padding:12px;
  border-radius:25px;
  border:none;
  outline:none;
}

/* ===== PRODUCTOS ===== */
.products{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
  gap:15px;
  padding:10px;
}
.card{
  background:var(--gold);
  color:#000;
  border-radius:16px;
  padding:10px;
  animation:fadeUp .4s ease;
}
.card img{
  width:100%;
  border-radius:10px;
}
.card button{
  width:100%;
  padding:8px;
  border:none;
  border-radius:8px;
  background:#000;
  color:var(--gold);
}
.fav{
  text-align:right;
  font-size:20px;
  cursor:pointer;
}

/* ===== ANIMACIONES ===== */
@keyframes fadeUp{
  from{opacity:0;transform:translateY(15px)}
  to{opacity:1;transform:translateY(0)}
}

/* ===== BARRA MÓVIL ===== */
.mobile-bar{
  position:fixed;
  bottom:0;
  width:100%;
  background:#111;
  display:flex;
  justify-content:space-around;
  padding:10px 0;
  z-index:2500;
}
.mobile-bar button{
  background:none;
  border:none;
  color:var(--gold);
}
</style>
</head>

<body>

<header>
  <div class="menu-btn" onclick="toggleMenu()">☰</div>
  <b>Go Shop</b>
  <div class="cart-btn" onclick="goCart()">🛒 <span id="cartCount">0</span></div>
</header>

<div class="side-menu" id="menu">
  <button onclick="toggleSub()">Productos ▸</button>
  <div class="submenu" id="submenu">
    <button onclick="filterCat('Perfumes Hombre')">Perfumes Hombre</button>
    <button onclick="filterCat('Perfumes Mujer')">Perfumes Mujer</button>
    <button onclick="filterCat('Relojes')">Relojes</button>
    <button onclick="filterCat('Tenis')">Tenis</button>
  </div>
  <button onclick="openWA()">Contacto</button>
</div>

<main>
  <div class="products" id="products"></div>
</main>

<!-- BUSCADOR -->
<div class="search-fab" onclick="toggleSearch()">🔍</div>
<div class="search-box" id="searchBox">
  <input type="text" placeholder="Buscar..." oninput="search(this.value)">
</div>

<div class="mobile-bar">
  <button onclick="location.reload()">🏠</button>
  <button onclick="goCart()">🛒</button>
  <button onclick="openWA()">💬</button>
</div>

<script>
const data=[
{name:"Invictus",price:60,cat:"Perfumes Hombre",img:"images/perfume2.jpg"},
{name:"Valentino",price:60,cat:"Perfumes Hombre",img:"images/perfume1.jpg"},
{name:"Delina",price:60,cat:"Perfumes Mujer",img:"images/perfume19.jpg"},
{name:"Rolex",price:150,cat:"Relojes",img:"images/reloj1.jpg"},
{name:"Nike Air",price:80,cat:"Tenis",img:"images/tenis1.jpg"},
];

let cart=JSON.parse(localStorage.getItem("cart"))||[];
let favs=JSON.parse(localStorage.getItem("favs"))||[];
let cat=null;

function render(list=data){
  const p=document.getElementById("products");
  p.innerHTML="";
  list.forEach(i=>{
    const f=favs.find(f=>f.name===i.name)?"❤️":"🤍";
    p.innerHTML+=`
    <div class="card">
      <div class="fav" onclick='toggleFav(${JSON.stringify(i)})'>${f}</div>
      <img src="${i.img}">
      <b>${i.name}</b><br>$${i.price}
      <button onclick='addCart(${JSON.stringify(i)})'>Agregar</button>
    </div>`;
  });
}

function addCart(i){
  cart.push({...i,qty:1});
  localStorage.setItem("cart",JSON.stringify(cart));
  updateCount();
}

function toggleFav(i){
  favs=favs.find(f=>f.name===i.name)?favs.filter(f=>f.name!==i.name):[...favs,i];
  localStorage.setItem("favs",JSON.stringify(favs));
  render(cat?data.filter(d=>d.cat===cat):data);
}

function search(t){
  render(data.filter(p=>p.name.toLowerCase().includes(t.toLowerCase())));
}

function filterCat(c){
  cat=c;
  render(data.filter(d=>d.cat===c));
}

function updateCount(){
  document.getElementById("cartCount").innerText=cart.length;
}

function toggleMenu(){
  const m=document.getElementById("menu");
  m.style.left=m.style.left==="0px"?"-260px":"0px";
}
function toggleSub(){
  const s=document.getElementById("submenu");
  s.style.display=s.style.display==="block"?"none":"block";
}
function toggleSearch(){
  const b=document.getElementById("searchBox");
  b.style.width=b.style.width==="220px"?"0":"220px";
}
function goCart(){location.href="pagina-del-carro.html"}
function openWA(){window.open("https://chat.whatsapp.com/EyDTR5Yg9LF7RSJyAUYIWX?mode=gi_t","_blank")}

updateCount();render();
</script>

</body>
</html>
