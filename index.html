<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Go Shop</title>
<link rel="stylesheet" href="styles.css">
<style>
/* ========== GENERAL ========== */
body { background:#000; color:#fff; font-family:Arial, sans-serif; margin:0; padding:0; text-align:center;}
header { background:#111; color:#FFD700; padding:20px; position:relative; display:flex; justify-content:center; align-items:center; font-size:2rem;}
.menu-btn { position:absolute; left:20px; font-size:28px; cursor:pointer; color:#FFD700; }
.cart-btn { position:absolute; right:20px; font-size:28px; cursor:pointer; color:#FFD700; }
.cart-btn span { background:#000; color:#FFD700; padding:2px 7px; border-radius:50%; font-size:14px; vertical-align:super; }

/* ========== MENÚ LATERAL ========== */
.side-menu { position:fixed; left:-250px; top:0; width:250px; height:100%; background:#111; padding:20px; transition:left 0.3s ease; z-index:1000;}
.side-menu button { display:block; width:100%; background:#000; color:#FFD700; padding:12px; margin-bottom:10px; border:none; border-radius:10px; font-weight:bold; cursor:pointer;}
.submenu { display:none; margin-left:10px; margin-top:10px; }
.submenu button { background:#222; color:#FFD700; margin-bottom:5px; padding:10px; border-radius:8px; border:none; cursor:pointer; }

/* ========== SECCIONES ========== */
.category-section { margin:30px 0; }
.category-section h2 { color:#FFD700; margin-bottom:15px; font-size:1.8rem; }

/* ========== PRODUCTOS ========== */
.products { display:flex; flex-wrap:wrap; justify-content:center; gap:20px; }
.product-card { background:#FFD700; border-radius:15px; width:220px; padding:15px; text-align:center; color:#000; }
.product-card img { width:100%; border-radius:10px; }
.product-card h2 { margin:10px 0 5px 0; }
.product-card .price { font-weight:bold; margin:10px 0; }
.product-card button { padding:10px 15px; background:#000; color:#FFD700; border-radius:8px; cursor:pointer; font-weight:bold; border:none; }

/* ========== PAGINACIÓN ========== */
.pagination { margin:15px 0; }
.page-btn { background:#000; color:#FFD700; border:none; padding:8px 12px; margin:0 5px; border-radius:8px; cursor:pointer;}
.page-btn:hover { background:#222; }

/* ========== RESPONSIVE ========== */
@media screen and (max-width:600px){ 
  .product-card{ width:90%; } 
  .side-menu{ width:90%; } 
}
</style>
</head>
<body>

<header>
  <div class="menu-btn" id="menu-btn">☰</div>
  <h1>Go Shop</h1>
  <div class="cart-btn" id="cart-btn">🛒 <span id="cart-count">0</span></div>
</header>

<!-- MENÚ LATERAL -->
<div id="side-menu" class="side-menu">
  <button id="btn-products">Productos ▸</button>
  <div class="submenu" id="submenu-products">
    <button onclick="filterCategory('Perfumes Hombre')">Perfumes Hombre</button>
    <button onclick="filterCategory('Perfumes Mujer')">Perfumes Mujer</button>
    <button onclick="filterCategory('Relojes')">Relojes</button>
    <button onclick="filterCategory('Tenis')">Tenis</button>
  </div>
  <button id="btn-contact">Contacto</button>
</div>

<!-- CONTENEDOR DE PRODUCTOS -->
<div id="products-container"></div>
<div id="pagination" class="pagination"></div>

<script>
// ===== DATOS DE PRODUCTOS =====
const products = [
  // PERFUMES HOMBRE
  {name:"Perfume Valentino", price:60, category:"Perfumes Hombre", img:"images/perfume1.jpg"},
  {name:"Perfume Invictus", price:60, category:"Perfumes Hombre", img:"images/perfume2.jpg"},
  {name:"Perfume Dior", price:60, category:"Perfumes Hombre", img:"images/perfume3.jpg"},
  {name:"Perfume Dior Elixir", price:60, category:"Perfumes Hombre", img:"images/perfume4.jpg"},
  {name:"Perfume MYSLF", price:60, category:"Perfumes Hombre", img:"images/perfume5.jpg"},
  {name:"Creed Aventus", price:60, category:"Perfumes Hombre", img:"images/perfume6.jpg"},
  {name:"Layton Exclusif", price:60, category:"Perfumes Hombre", img:"images/perfume7.jpg"},
  {name:"YSL Eau de Parfum", price:60, category:"Perfumes Hombre", img:"images/perfume8.jpg"},
  {name:"Xerjoff Erba Pura", price:60, category:"Perfumes Hombre", img:"images/perfume9.jpg"},
  {name:"JPG Scandal", price:60, category:"Perfumes Hombre", img:"images/perfume10.jpg"},
  {name:"JPG Le Male", price:60, category:"Perfumes Hombre", img:"images/perfume11.jpg"},
  {name:"JPG Le Beau", price:60, category:"Perfumes Hombre", img:"images/perfume12.jpg"},
  {name:"JPG Le Male Elixir", price:60, category:"Perfumes Hombre", img:"images/perfume13.jpg"},
  {name:"JPG Ultra Male", price:60, category:"Perfumes Hombre", img:"images/perfume14.jpg"},
  {name:"Valentino Intense", price:60, category:"Perfumes Hombre", img:"images/perfume15.jpg"},
  {name:"Santal 33", price:60, category:"Perfumes Hombre", img:"images/perfume16.jpg"},
  {name:"Azzaro The Most Wanted", price:60, category:"Perfumes Hombre", img:"images/perfume17.jpg"},
  // PERFUMES MUJER
  {name:"Dior J’adore", price:60, category:"Perfumes Mujer", img:"images/perfume18.jpg"},
  {name:"Delina", price:60, category:"Perfumes Mujer", img:"images/perfume19.jpg"},
  {name:"Stronger With You Mujer", price:60, category:"Perfumes Mujer", img:"images/perfume20.jpg"},
  // RELOJES
  {name:"Reloj Rolex", price:150, category:"Relojes", img:"images/reloj1.jpg"},
  {name:"Reloj Casio", price:50, category:"Relojes", img:"images/reloj2.jpg"},
  // TENIS
  {name:"Tenis Nike", price:80, category:"Tenis", img:"images/tenis1.jpg"},
  {name:"Tenis Adidas", price:85, category:"Tenis", img:"images/tenis2.jpg"}
];

// ===== VARIABLES =====
let currentPage = 1;
let itemsPerPage = 6;
let currentCategory = null;

// ===== FILTRAR CATEGORÍA =====
function filterCategory(category){
  currentCategory = category;
  currentPage = 1;
  displayProducts();
}

// ===== MOSTRAR PRODUCTOS =====
function displayProducts(){
  const container = document.getElementById("products-container");
  container.innerHTML = "";
  let filtered = currentCategory ? products.filter(p=>p.category===currentCategory) : products;
  let totalPages = Math.ceil(filtered.length/itemsPerPage);
  const start = (currentPage-1)*itemsPerPage;
  const end = start+itemsPerPage;

  filtered.slice(start,end).forEach(p=>{
    const div = document.createElement("div");
    div.classList.add("product-card");
    div.innerHTML = `
      <img src="${p.img}" alt="${p.name}">
      <h2>${p.name}</h2>
      <div class="price">$${p.price.toFixed(2)}</div>
      <button class="btn-add" data-name="${p.name}" data-price="${p.price}" data-img="${p.img}">Agregar</button>
    `;
    container.appendChild(div);
  });

  // PAGINACIÓN
  const paginationDiv = document.getElementById("pagination");
  paginationDiv.innerHTML="";
  for(let i=1;i<=totalPages;i++){
    const btn = document.createElement("button");
    btn.classList.add("page-btn");
    btn.textContent=i;
    if(i===currentPage) btn.style.background="#FFD700";
    btn.addEventListener("click",()=>{ currentPage=i; displayProducts(); });
    paginationDiv.appendChild(btn);
  }

  initAddButtons();
}

// ===== CARRITO =====
let cartItems = JSON.parse(localStorage.getItem("cartItems"))||[];

function updateCartCount(){
  document.getElementById("cart-count").textContent = cartItems.length;
}

function initAddButtons(){
  document.querySelectorAll(".btn-add").forEach(btn=>{
    btn.addEventListener("click",()=>{
      const name=btn.dataset.name;
      const price=parseFloat(btn.dataset.price);
      const img=btn.dataset.img;
      cartItems.push({name,price,img});
      localStorage.setItem("cartItems",JSON.stringify(cartItems));
      updateCartCount();
      alert(`${name} agregado al carrito`);
    });
  });
}

// MENÚ LATERAL
document.getElementById("menu-btn").addEventListener("click",()=>{
  const sideMenu = document.getElementById("side-menu");
  sideMenu.style.left = sideMenu.style.left==="0px"? "-250px":"0px";
});
document.getElementById("btn-products").addEventListener("click",()=>{
  const submenu = document.getElementById("submenu-products");
  submenu.style.display = submenu.style.display==="block"?"none":"block";
});
document.getElementById("btn-contact").addEventListener("click",()=>{
  window.open("https://chat.whatsapp.com/EyDTR5Yg9LF7RSJyAUYIWX?mode=gi_t","_blank");
});

// ABRIR CARRITO
document.getElementById("cart-btn").addEventListener("click",()=>{
  window.location.href="pagina-del-carro.html";
});

// INICIALIZAR
displayProducts();
updateCartCount();
</script>

</body>
</html>
