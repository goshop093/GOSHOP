<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Go Shop</title>

<style>
:root{
  --primary:#800000; /* rojo vino */
  --dark:#111;
  --bg:#000;
}

body{
  background:var(--bg);
  color:#fff;
  font-family:Arial, sans-serif;
  margin:0;
  overflow-x:hidden;
}

/* HEADER */
header{
  position:fixed;
  top:0;
  width:100%;
  background:var(--dark);
  color:var(--primary);
  display:flex;
  justify-content:center;
  align-items:center;
  padding:14px;
  z-index:1000;
  font-size:1.5rem;
}
.menu-btn,.cart-btn{
  position:absolute;
  font-size:24px;
  cursor:pointer;
}
.menu-btn{left:15px}
.cart-btn{right:15px}
.cart-btn span{
  background:var(--bg);
  padding:2px 6px;
  border-radius:50%;
  font-size:12px;
}

/* SIDE MENU */
.side-menu{
  position:fixed;
  left:-260px;
  top:0;
  width:260px;
  height:100%;
  background:var(--dark);
  padding:20px;
  transition:left 0.3s ease;
  z-index:2000;
}
.side-menu button{
  width:100%;
  background:var(--bg);
  color:var(--primary);
  border:none;
  padding:12px;
  border-radius:10px;
  margin-bottom:10px;
  font-weight:bold;
}
.submenu{display:none;margin-left:10px}

/* BUSCADOR */
.search-fab{
  position:fixed;
  bottom:90px;
  right:20px;
  background:var(--primary);
  color:#fff;
  width:55px;
  height:55px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:22px;
  z-index:3000;
  cursor:pointer;
}
.search-box{
  position:fixed;
  bottom:160px;
  right:20px;
  width:0;
  overflow:hidden;
  transition:.3s;
}
.search-box input{
  width:220px;
  padding:12px;
  border-radius:25px;
  border:none;
}

/* SECCIONES HORIZONTALES */
.section-title{
  text-align:left;
  font-size:1.3rem;
  margin:10px 15px;
  color:var(--primary);
}
.horizontal-scroll{
  display:flex;
  overflow-x:auto;
  padding:10px;
  gap:10px;
}
.horizontal-scroll::-webkit-scrollbar{
  height:8px;
}
.horizontal-scroll::-webkit-scrollbar-thumb{
  background:var(--primary);
  border-radius:10px;
}
.card{
  min-width:120px;
  max-width:140px;
  background:var(--primary);
  color:#fff;
  border-radius:16px;
  padding:10px;
  flex-shrink:0;
  text-align:center;
}
.card img{
  width:100%;
  border-radius:10px;
}
.card button{
  width:100%;
  padding:6px;
  border:none;
  border-radius:8px;
  background:#000;
  color:var(--primary);
  margin-top:5px;
}

/* MOBILE BAR */
.mobile-bar{
  position:fixed;
  bottom:0;
  width:100%;
  background:var(--dark);
  display:flex;
  justify-content:space-around;
  padding:10px 0;
}
.mobile-bar button{
  background:none;
  border:none;
  color:var(--primary);
}

/* RESPONSIVE */
@media screen and (max-width:600px) {
  .card {
    min-width:100px;
  }
}

/* ANIMACION */
@keyframes fadeUp{
  from{opacity:0;transform:translateY(15px)}
  to{opacity:1;transform:translateY(0)}
}
</style>
</head>

<body>

<header>
  <div class="menu-btn" onclick="toggleMenu()">☰</div>
  <b>Go Shop</b>
  <div class="cart-btn" onclick="goCart()">🛒 <span id="cartCount">0</span></div>
</header>

<!-- MENÚ LATERAL -->
<div class="side-menu" id="menu">
  <button onclick="toggleSub()">Productos ▸</button>
  <div class="submenu" id="submenu">
    <button onclick="location.href='perfumes.html'">Perfumes</button>
    <button onclick="location.href='sneakers.html'">Sneakers</button>
    <button onclick="location.href='relojes.html'">Relojes</button>
  </div>
  <button onclick="showFavs()">❤️ Favoritos</button>
  <button onclick="openWA()">Contacto</button>
</div>

<!-- BUSCADOR -->
<div class="search-fab" onclick="toggleSearch()">🔍</div>
<div class="search-box" id="searchBox">
  <input type="text" placeholder="Buscar..." oninput="search(this.value)">
</div>

<main style="padding-top:90px;padding-bottom:90px">

  <!-- PERFUMES -->
  <div class="section-title">Perfumes <button onclick="location.href='perfumes.html'" style="float:right;background:#000;color:var(--primary);border:none;padding:4px 10px;border-radius:6px;">Ver todos</button></div>
  <div class="horizontal-scroll" id="perfumes"></div>

  <!-- SNEAKERS -->
  <div class="section-title">Sneakers <button onclick="location.href='sneakers.html'" style="float:right;background:#000;color:var(--primary);border:none;padding:4px 10px;border-radius:6px;">Ver todos</button></div>
  <div class="horizontal-scroll" id="sneakers"></div>

  <!-- RELOJES -->
  <div class="section-title">Relojes <button onclick="location.href='relojes.html'" style="float:right;background:#000;color:var(--primary);border:none;padding:4px 10px;border-radius:6px;">Ver todos</button></div>
  <div class="horizontal-scroll" id="relojes"></div>

</main>

<!-- BARRA INFERIOR -->
<div class="mobile-bar">
  <button onclick="location.reload()">🏠</button>
  <button onclick="goCart()">🛒</button>
  <button onclick="openWA()">💬</button>
</div>

<script>
// CARRITO
let cart = JSON.parse(localStorage.getItem("cart")) || [];
function addCart(name,img){
  const index = cart.findIndex(p => p.name===name);
  if(index!==-1){ cart[index].qty++; }
  else{ cart.push({name,img,qty:1}); }
  localStorage.setItem("cart",JSON.stringify(cart));
  updateCount();
  alert(name + " agregado al carrito");
}
function updateCount(){
  document.getElementById("cartCount").innerText = cart.reduce((a,b)=>a.qty+a,0);
}

// MENU Y BUSCADOR
function toggleMenu(){
  const menu = document.getElementById("menu");
  menu.style.left = menu.style.left==="0px"? "-260px":"0px";
}
function toggleSub(){
  const s = document.getElementById("submenu");
  s.style.display = s.style.display==="block"?"none":"block";
}
function toggleSearch(){
  const b = document.getElementById("searchBox");
  b.style.width = b.style.width==="220px"? "0":"220px";
}
function goCart(){ location.href="pagina-del-carro.html"; }
function openWA(){ window.open("https://wa.me/13129348674","_blank"); }
function search(t){ console.log("Buscar: ",t); }

// DATOS
const perfumesData=[
  {name:"Valentino",img:"images/perfume1.jpg"},
  {name:"JPG Scandal",img:"images/perfume10.jpg"},
  {name:"Dior",img:"images/perfume3.jpg"},
  {name:"Creed Aventus",img:"images/perfume6.jpg"},
  {name:"Tom Ford Lost Cherry",img:"images/perfume33.jpg"},
  {name:"Versace Eros",img:"images/perfume40.jpg"},
  {name:"Gucci Bloom",img:"images/perfume39.jpg"},
  {name:"YSL Eau de Parfum",img:"images/perfume8.jpg"},
  {name:"Invictus",img:"images/perfume2.jpg"},
  {name:"Bleu De Chanel Parfum",img:"images/perfume29.jpg"}
];

const sneakersData=[
  {name:"Jordan 4 Black Cat",img:"images/jordan4blackcat.jpg"},
  {name:"Nike Air Force 1",img:"images/af1.jpg"},
  {name:"Adidas Yeezy",img:"images/yeezy.jpg"},
  {name:"Air Jordan 1",img:"images/jordan1.jpg"},
  {name:"Nike Dunk Low",img:"images/dunklow.jpg"},
  {name:"New Balance 550",img:"images/nb550.jpg"},
  {name:"Puma RS-X",img:"images/pumarsx.jpg"},
  {name:"Reebok Question",img:"images/reebokquestion.jpg"},
  {name:"Asics Gel Lyte",img:"images/asicsgel.jpg"},
  {name:"Converse Chuck 70",img:"images/converse70.jpg"}
];

const relojesData=[
  {name:"Rolex Submariner",img:"images/rolex1.jpg"},
  {name:"Omega Seamaster",img:"images/omega1.jpg"},
  {name:"Tag Heuer Carrera",img:"images/tag1.jpg"},
  {name:"Audemars Piguet Royal Oak",img:"images/ap1.jpg"},
  {name:"Cartier Santos",img:"images/cartier1.jpg"},
  {name:"Hublot Big Bang",img:"images/hublot1.jpg"},
  {name:"Tissot PRX",img:"images/tissot1.jpg"},
  {name:"Seiko Prospex",img:"images/seiko1.jpg"},
  {name:"Casio G-Shock",img:"images/casio1.jpg"},
  {name:"Fossil Machine",img:"images/fossil1.jpg"}
];

// RENDER SECCIONES
function renderSection(id,data){
  const container = document.getElementById(id);
  container.innerHTML = "";
  data.forEach(item=>{
    const card = document.createElement("div");
    card.className="card";
    card.innerHTML=`
      <img src="${item.img}" alt="${item.name}">
      <b>${item.name}</b>
      <button onclick='addCart("${item.name}","${item.img}")'>Agregar</button>
    `;
    container.appendChild(card);
  });
}

// INICIALIZAR
renderSection("perfumes",perfumesData);
renderSection("sneakers",sneakersData);
renderSection("relojes",relojesData);
updateCount();
</script>

</body>
</html>
