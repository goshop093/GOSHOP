<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi Carrito - Go Shop</title>
<style>
:root{
  --gold:#FFD700;
  --dark:#111;
}
body{
  background:#000;
  color:#fff;
  font-family:Arial,sans-serif;
  margin:0;
  padding:0;
}
header{
  position:fixed;
  top:0;
  width:100%;
  background:var(--dark);
  color:var(--gold);
  text-align:center;
  padding:15px;
  font-size:1.8rem;
  z-index:1000;
}
main{
  padding:80px 15px 20px 15px;
  max-width:900px;
  margin:0 auto;
}
.cart-item{
  display:flex;
  align-items:center;
  background:#222;
  margin-bottom:15px;
  border-radius:12px;
  padding:10px;
  gap:10px;
}
.cart-item img{
  width:100px;
  height:100px;
  object-fit:cover;
  border-radius:10px;
}
.cart-item .info{
  flex:1;
}
.cart-item .info b{
  display:block;
  margin-bottom:5px;
}
.qty-controls{
  display:flex;
  align-items:center;
  gap:5px;
  margin-top:5px;
}
.qty-controls button{
  padding:3px 8px;
  border:none;
  border-radius:6px;
  background:#000;
  color:var(--gold);
  cursor:pointer;
}
.remove-btn{
  background:#000;
  color:var(--gold);
  border:none;
  padding:5px 10px;
  border-radius:6px;
  cursor:pointer;
}
.cart-total{
  text-align:center;
  font-size:1.5rem;
  margin:20px 0;
  font-weight:bold;
}
.btn{
  display:block;
  width:200px;
  margin:15px auto;
  padding:12px;
  background:var(--gold);
  color:#000;
  border:none;
  border-radius:12px;
  font-weight:bold;
  cursor:pointer;
  text-align:center;
  text-decoration:none;
}
@media screen and (max-width:600px){
  .cart-item{flex-direction:column;align-items:flex-start;}
  .cart-item img{width:100%;height:auto;}
}
</style>
</head>
<body>

<header>Mi Carrito</header>
<main>
  <div id="cartItems"></div>
  <div class="cart-total">Total: $<span id="total">0</span></div>
  <button class="btn" onclick="goBack()">← Volver a la tienda</button>
  <button class="btn" id="sendWA">Enviar pedido por WhatsApp</button>
</main>

<script>
// ===== VARIABLES =====
let cart = JSON.parse(localStorage.getItem("cart")) || [];

// ===== FUNCIONES =====
function renderCart(){
  const container = document.getElementById("cartItems");
  container.innerHTML="";
  let total = 0;

  cart.forEach((item,index)=>{
    total += item.price*item.qty;
    const div = document.createElement("div");
    div.className="cart-item";
    div.innerHTML=`
      <img src="${item.img}" alt="${item.name}">
      <div class="info">
        <b>${item.name}</b>
        $${item.price.toFixed(2)}
        <div class="qty-controls">
          <button onclick="changeQty(${index},-1)">-</button>
          <span>${item.qty}</span>
          <button onclick="changeQty(${index},1)">+</button>
        </div>
      </div>
      <button class="remove-btn" onclick="removeItem(${index})">X</button>
    `;
    container.appendChild(div);
  });

  document.getElementById("total").innerText=total.toFixed(2);
  localStorage.setItem("cart",JSON.stringify(cart));
}

function changeQty(i,delta){
  cart[i].qty += delta;
  if(cart[i].qty<1) cart[i].qty=1;
  renderCart();
}

function removeItem(i){
  cart.splice(i,1);
  renderCart();
}

function goBack(){
  window.location.href="index.html";
}

// ===== ENVIAR PEDIDO POR WHATSAPP =====
document.getElementById("sendWA").addEventListener("click",()=>{
  if(cart.length===0){alert("El carrito está vacío");return;}
  let message="Hola! Quiero hacer el siguiente pedido:\n";
  cart.forEach(i=>{
    message += `${i.name} x${i.qty} - $${(i.price*i.qty).toFixed(2)}\n`;
  });
  message += `Total: $${cart.reduce((a,b)=>a+a*b.price*b.qty,0).toFixed(2)}`;
  const phone = "13129348674"; // tu número USA
  const url = `https://wa.me/${phone}?text=${encodeURIComponent(message)}`;
  window.open(url,"_blank");
});

// ===== INICIALIZAR =====
renderCart();
</script>

</body>
</html>
