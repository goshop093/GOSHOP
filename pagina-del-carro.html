<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carrito - Go Shop</title>
<style>
:root{--gold:#FFD700;--dark:#111}
body{margin:0;font-family:Arial, sans-serif;background:#000;color:#fff;padding-top:90px;overflow-x:hidden}
header{position:fixed;top:0;width:100%;background:var(--dark);color:var(--gold);display:flex;justify-content:center;align-items:center;padding:14px;z-index:1000}
header b{font-size:1.5rem}
.cart-container{padding:10px}
.cart-item{display:flex;align-items:center;background:var(--gold);color:#000;border-radius:16px;margin-bottom:10px;padding:10px;animation:fadeUp .4s ease}
.cart-item img{width:80px;height:80px;object-fit:cover;border-radius:10px;margin-right:10px}
.cart-info{flex:1}
.cart-info b{display:block;margin-bottom:5px}
.qty-controls{display:flex;align-items:center;gap:5px;margin-top:5px}
.qty-controls button{width:28px;height:28px;border:none;border-radius:5px;background:#000;color:var(--gold);font-size:18px;cursor:pointer}
.total{text-align:right;font-size:1.2rem;margin-top:10px;color:var(--gold)}
.send-btn{width:100%;padding:12px;border:none;border-radius:10px;background:var(--gold);color:#000;font-size:1rem;margin-top:15px;cursor:pointer}
@keyframes fadeUp{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>

<header><b>Carrito</b></header>

<div class="cart-container" id="cartContainer"></div>

<div class="total" id="total">Total: $0</div>
<button class="send-btn" onclick="sendWhatsApp()">Enviar por WhatsApp</button>

<script>
// ==== Trae carrito del index ====
let cart = JSON.parse(localStorage.getItem("cart")) || [];

// Renderiza carrito
function renderCart(){
  const container = document.getElementById("cartContainer");
  container.innerHTML="";
  cart.forEach((item,index)=>{
    const div = document.createElement("div");
    div.className="cart-item";
    div.innerHTML=`
      <img src="${item.img}" alt="${item.name}">
      <div class="cart-info">
        <b>${item.name}</b>
        $${item.price} x ${item.qty}
        <div class="qty-controls">
          <button onclick="changeQty(${index},-1)">-</button>
          <span>${item.qty}</span>
          <button onclick="changeQty(${index},1)">+</button>
        </div>
      </div>
    `;
    container.appendChild(div);
  });
  updateTotal();
}

function changeQty(i,delta){
  cart[i].qty += delta;
  if(cart[i].qty < 1) cart.splice(i,1);
  localStorage.setItem("cart",JSON.stringify(cart));
  renderCart();
}

// Calcula total
function updateTotal(){
  const total = cart.reduce((sum,item)=>sum + item.price*item.qty,0);
  document.getElementById("total").innerText = `Total: $${total}`;
}

// Envía carrito por WhatsApp como link
function sendWhatsApp(){
  if(cart.length === 0) return alert("El carrito está vacío");
  const cartData = encodeURIComponent(JSON.stringify(cart));
  const link = `${location.origin}/pagina-del-carro.html?cart=${cartData}`;
  const url = `https://wa.me/13129348674?text=Pedido:%20${link}`;
  window.open(url,"_blank");
}

// Al abrir con link de carrito, carga datos
function loadFromLink(){
  const params = new URLSearchParams(location.search);
  if(params.has("cart")){
    try{
      const loadedCart = JSON.parse(decodeURIComponent(params.get("cart")));
      if(Array.isArray(loadedCart)){
        cart = loadedCart;
        localStorage.setItem("cart",JSON.stringify(cart));
      }
    }catch(e){console.log("Error cargando carrito desde link",e);}
  }
}

loadFromLink();
renderCart();
</script>

</body>
</html>
