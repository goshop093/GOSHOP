<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi Carrito - Go Shop</title>
<style>
:root{
  --primary:#800000;
  --dark:#111;
  --bg:#000;
  --text:#fff;
}

/* RESET Y BODY */
*{box-sizing:border-box;}
body{background:var(--bg);color:var(--text);font-family:Arial,sans-serif;margin:0;padding:0;overflow-x:hidden;}
button{cursor:pointer;transition:.3s;}
button:hover{opacity:0.8;}

/* HEADER */
header{
  background:var(--dark);
  color:var(--primary);
  display:flex;
  justify-content:center;
  align-items:center;
  padding:14px;
  position:fixed;
  top:0;
  width:100%;
  z-index:1000;
  font-size:1.8rem;
}
header b{flex:1;text-align:center;}

/* CONTENEDOR CARRITO */
.cart-page{padding:120px 20px 20px 20px;max-width:900px;margin:0 auto;}
.cart-item{
  display:flex;
  align-items:center;
  justify-content:space-between;
  background:var(--dark);
  margin-bottom:15px;
  padding:10px;
  border-radius:10px;
  transition:all .3s ease;
}
.cart-item img{width:100px;height:100px;object-fit:cover;border-radius:10px;}
.cart-item .info{flex:1;margin-left:15px;}
.cart-item .info p{margin:4px 0;}

/* BOTONES */
.qty-btn{
  padding:4px 8px;
  margin:0 4px;
  background:var(--primary);
  color:var(--text);
  border:none;
  border-radius:5px;
  font-weight:bold;
}
.remove-btn{
  background:var(--primary);
  color:var(--text);
  border:none;
  padding:6px 10px;
  border-radius:6px;
  font-weight:bold;
}

/* TOTAL */
.cart-total{
  font-size:1.5rem;
  font-weight:bold;
  text-align:center;
  margin-top:20px;
}

/* BOTONES DE ACCIÓN */
.btn-actions{
  display:flex;
  justify-content:center;
  gap:15px;
  margin-top:20px;
  flex-wrap:wrap;
}
.btn-actions button{
  padding:10px 20px;
  background:var(--primary);
  color:var(--text);
  border:none;
  border-radius:10px;
  font-weight:bold;
  transition:.3s;
}
.btn-actions button:hover{background:#4d0000;}

/* BUSCADOR */
.search-cart{margin:15px 0;text-align:center;}
.search-cart input{
  width:90%;
  max-width:400px;
  padding:10px;
  border-radius:25px;
  border:none;
  outline:none;
  font-size:16px;
  background:#222;
  color:#fff;
}

/* ANIMACIÓN */
@keyframes fadeIn{
  from{opacity:0;transform:translateY(20px)}
  to{opacity:1;transform:translateY(0)}
}

/* RESPONSIVE */
@media screen and (max-width:600px){
  .cart-item{flex-direction:column;align-items:flex-start;}
  .cart-item img{width:100%;height:auto;}
  .cart-item .info{margin-left:0;margin-top:10px;}
}
</style>
</head>
<body>

<header>
  <b>Mi Carrito</b>
</header>

<section class="cart-page">

  <div class="search-cart">
    <input type="text" placeholder="Buscar en el carrito..." id="cartSearch" oninput="searchCart(this.value)">
  </div>

  <div id="cart-container"></div>

  <div class="cart-total">
    Subtotal: $<span id="cart-subtotal">0</span><br>
    Envío: $0<br>
    <b>Total: $<span id="cart-total">0</span></b>
  </div>

  <div class="btn-actions">
    <button onclick="goBack()">← Regresar a la tienda</button>
    <button onclick="sendOrder()">Enviar Pedido WhatsApp</button>
  </div>
</section>

<script>
let cart = JSON.parse(localStorage.getItem('cart')) || [];
let filteredCart = [...cart];

// ====== RENDER CARRITO ======
function updateCart(){
  const container = document.getElementById('cart-container');
  const subtotalSpan = document.getElementById('cart-subtotal');
  const totalSpan = document.getElementById('cart-total');
  container.innerHTML = '';
  let subtotal = 0;

  filteredCart.forEach((item,index)=>{
    const totalItem = item.price * item.qty;
    subtotal += totalItem;

    const div = document.createElement('div');
    div.className = 'cart-item animate';
    div.innerHTML = `
      <img src="${item.img}" alt="${item.name}">
      <div class="info">
        <p><b>${item.name}</b></p>
        <p>Talla: ${item.size}</p>
        <p>Precio unitario: $${item.price.toFixed(2)}</p>
        <p>Cantidad:
          <button class="qty-btn" onclick="changeQty(${index},-1)">-</button>
          ${item.qty}
          <button class="qty-btn" onclick="changeQty(${index},1)">+</button>
        </p>
        <p>Total: $${totalItem.toFixed(2)}</p>
      </div>
      <button class="remove-btn" onclick="removeItem(${index})">X</button>
    `;
    container.appendChild(div);
  });

  const envio = 0;
  subtotalSpan.textContent = subtotal.toFixed(2);
  totalSpan.textContent = (subtotal + envio).toFixed(2);

  localStorage.setItem('cart',JSON.stringify(cart));
}

// ====== CANTIDAD + / - ======
function changeQty(index,delta){
  const realIndex = cart.findIndex(i=>i.name===filteredCart[index].name && i.size===filteredCart[index].size);
  cart[realIndex].qty += delta;
  if(cart[realIndex].qty<1) cart[realIndex].qty=1;
  filteredCart[index].qty = cart[realIndex].qty;
  updateCart();
}

// ====== ELIMINAR PRODUCTO ======
function removeItem(index){
  const realIndex = cart.findIndex(i=>i.name===filteredCart[index].name && i.size===filteredCart[index].size);
  cart.splice(realIndex,1);
  filteredCart.splice(index,1);
  updateCart();
}

// ====== BUSCADOR ======
function searchCart(text){
  filteredCart = cart.filter(i=>i.name.toLowerCase().includes(text.toLowerCase()) || i.size.toLowerCase().includes(text.toLowerCase()));
  updateCart();
}

// ====== REGRESAR ======
function goBack(){window.location.href='sneakers.html';}

// ====== WHATSAPP ======
function sendOrder(){
  if(cart.length===0){alert('El carrito está vacío'); return;}
  let msg = 'Pedido Go Shop:\n';
  cart.forEach(i=>{
    const totalItem = i.price * i.qty;
    msg += `${i.name} - Talla: ${i.size} - $${i.price.toFixed(2)} x ${i.qty} = $${totalItem.toFixed(2)}\n`;
  });
  const total = cart.reduce((a,b)=>a + b.price*b.qty, 0).toFixed(2);
  msg += `Total: $${total} (Envío: $0)`;
  const waNumber = '13129348674';
  const url = `https://api.whatsapp.com/send?phone=${waNumber}&text=${encodeURIComponent(msg)}`;
  window.open(url,'_blank');
}

// ====== INICIALIZAR ======
updateCart();
</script>

</body>
</html>
