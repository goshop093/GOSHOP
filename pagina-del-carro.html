<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Mi Carrito - Go Shop</title>
<link rel="stylesheet" href="styles.css">
<style>
/* ================= CARRO COMPLETO ================= */
.cart-page {
  max-width: 900px;
  margin: 40px auto;
  padding: 20px;
  background: #111;
  border-radius: 15px;
  color: #FFD700;
}

.cart-item-page {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: #222;
  padding: 15px;
  margin-bottom: 15px;
  border-radius: 10px;
  transition: transform 0.3s ease, background 0.3s ease;
}

.cart-item-page:hover {
  transform: scale(1.02);
  background: #333;
}

.cart-item-page img {
  width: 120px;
  height: 120px;
  object-fit: cover;
  border-radius: 10px;
  transition: transform 0.3s ease;
}

.cart-item-page .info {
  text-align: left;
  margin-left: 15px;
}

.cart-item-page .info p {
  margin: 0;
}

.remove-btn-page {
  background: #000;
  color: #FFD700;
  border: none;
  padding: 8px 12px;
  border-radius: 6px;
  cursor: pointer;
  font-weight: bold;
  transition: background 0.3s ease;
}

.remove-btn-page:hover {
  background: #222;
}

.cart-total-page {
  text-align: center;
  font-size: 24px;
  font-weight: bold;
  margin-top: 20px;
}

.btn-clear-cart {
  display: block;
  margin: 20px auto;
  padding: 12px 25px;
  background: #000;
  color: #FFD700;
  border-radius: 10px;
  cursor: pointer;
  font-weight: bold;
  transition: background 0.3s ease, transform 0.3s ease;
}

.btn-clear-cart:hover {
  background: #222;
  transform: scale(1.05);
}

/* ================= CONTACTO ================= */
.contact-info {
  text-align: center;
  margin-top: 50px;
}

.contact-info a {
  color: #FFD700;
  text-decoration: underline;
}

/* ================= RESPONSIVE ================= */
@media screen and (max-width: 600px) {
  .cart-page { padding: 15px; }
  .cart-item-page { flex-direction: column; align-items: flex-start; }
  .cart-item-page .info { margin-left: 0; margin-top: 10px; }
  .cart-item-page img { width: 100%; height: auto; }
}
</style>
</head>
<body>

<header>
  <h1>Mi Carrito</h1>
  <div class="cart-btn" id="cart-count-header">🛒 <span id="cart-count">0</span></div>
</header>

<main>
  <section class="cart-page">
    <div id="cart-items-container"></div>

    <div class="cart-total-page">
      Total: $<span id="cart-total-page">0</span>
    </div>

    <button id="clear-cart" class="btn-clear-cart">Vaciar Carrito</button>
  </section>

  <section class="contact-info">
    <h2>Contacto</h2>
    <p>WhatsApp: <a href="https://wa.me/1234567890" target="_blank">Enviar mensaje</a></p>
    <p>Email: info@goshop.com</p>
  </section>
</main>

<script src="script.js"></script>
<script>
// ===== Mostrar productos con imagen, nombre y precio =====
function displayCartPage() {
  const container = document.getElementById("cart-items-container");
  const totalSpan = document.getElementById("cart-total-page");
  if (!container) return;

  container.innerHTML = "";
  let total = 0;

  cartItems.forEach((item, index) => {
    let imageName = item.name.toLowerCase().replace(/ /g,"").replace(/[^a-z0-9]/g,'');
    let imgSrc = `images/${imageName}.jpg`;

    const div = document.createElement("div");
    div.classList.add("cart-item-page");
    div.innerHTML = `
      <img src="${imgSrc}" alt="${item.name}">
      <div class="info">
        <p>${item.name}</p>
        <p>$${item.price.toFixed(2)}</p>
      </div>
      <button class="remove-btn-page" data-index="${index}">X</button>
    `;
    container.appendChild(div);
    total += item.price;
  });

  totalSpan.textContent = total.toFixed(2);

  // Botones eliminar
  document.querySelectorAll(".remove-btn-page").forEach(btn => {
    btn.addEventListener("click", () => {
      const index = btn.dataset.index;
      cartItems.splice(index, 1);
      localStorage.setItem("cartItems", JSON.stringify(cartItems));
      displayCartPage();
      updateCartCount();
    });
  });
}

// ===== Animación tipo “fly to cart” al agregar desde esta página =====
document.querySelectorAll(".btn-add").forEach(btn => {
  btn.addEventListener("click", e => {
    const productCard = btn.closest(".product-card");
    if (!productCard) return;
    
    const productImg = productCard.querySelector("img");
    const imgClone = productImg.cloneNode(true);
    const rect = productImg.getBoundingClientRect();
    
    imgClone.style.position = "fixed";
    imgClone.style.left = rect.left + "px";
    imgClone.style.top = rect.top + "px";
    imgClone.style.width = rect.width + "px";
    imgClone.style.height = rect.height + "px";
    imgClone.style.transition = "all 0.8s ease-in-out";
    imgClone.style.zIndex = "10000";
    document.body.appendChild(imgClone);
    
    const cartBtn = document.getElementById("cart-count-header");
    const cartRect = cartBtn.getBoundingClientRect();

    setTimeout(() => {
      imgClone.style.left = cartRect.left + "px";
      imgClone.style.top = cartRect.top + "px";
      imgClone.style.width = "30px";
      imgClone.style.height = "30px";
      imgClone.style.opacity = "0.5";
    }, 50);

    setTimeout(() => { imgClone.remove(); }, 900);
  });
});

// Vaciar carrito
const clearCartBtn = document.getElementById("clear-cart");
if (clearCartBtn) {
  clearCartBtn.addEventListener("click", () => {
    cartItems = [];
    localStorage.setItem("cartItems", JSON.stringify(cartItems));
    displayCartPage();
    updateCartCount();
  });
}

// Inicializar
updateCartCount();
displayCartPage();
</script>

</body>
</html>
