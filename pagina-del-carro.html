<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carrito - Go Shop</title>
<style>
:root{--gold:#FFD700;--dark:#111}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#000;color:#fff;overflow-x:hidden;padding-top:90px}header{position:fixed;top:0;width:100%;background:var(--dark);color:var(--gold);display:flex;justify-content:center;align-items:center;padding:14px;z-index:1000}header b{font-size:1.5rem}.back-btn{position:absolute;left:15px;font-size:24px;cursor:pointer}.products{display:grid;gap:15px;padding:10px}.cart-card{background:var(--gold);color:#000;border-radius:16px;padding:10px;display:flex;align-items:center;gap:10px;animation:fadeUp .4s ease}.cart-card img{width:80px;height:80px;object-fit:cover;border-radius:10px}.cart-card button{padding:5px 10px;border:none;border-radius:8px;background:#000;color:var(--gold);cursor:pointer}.cart-total{margin:15px 10px;font-size:1.3rem;font-weight:bold;text-align:right}.send-btn{width:calc(100%-20px);margin:10px;padding:12px;background:var(--gold);color:#000;border:none;border-radius:10px;font-size:1.2rem;cursor:pointer}.qty-control{display:flex;gap:5px;align-items:center}.qty-control button{width:25px;height:25px;text-align:center;padding:0}
@keyframes fadeUp{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:translateY(0)}}
</style>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
</head>
<body>

<header>
  <div class="back-btn" onclick="goBack()">←</div>
  <b>Carrito</b>
</header>

<main>
  <div class="products" id="cartProducts"></div>
  <div class="cart-total" id="cartTotal">Total: $0</div>
  <button class="send-btn" onclick="sendOrder()">Enviar Pedido</button>
</main>

<script>
// ===== Inicializar Firebase =====
const firebaseConfig = {
  apiKey: "AIzaSyBWA1abEfG8AMJo5qIYKDeK9-LjFq0IZZA",
  authDomain: "goshop-e3b8e.firebaseapp.com",
  projectId: "goshop-e3b8e",
  storageBucket: "goshop-e3b8e.appspot.com",
  messagingSenderId: "814425980665",
  appId: "1:814425980665:web:e7efac0149dff4f8206c28",
  measurementId: "G-HCC2C0G1ZM"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

// ===== Carrito =====
let cart = JSON.parse(localStorage.getItem("cart")) || [];

// ===== Renderizar carrito =====
function renderCart() {
  const container = document.getElementById("cartProducts");
  container.innerHTML = "";
  cart.forEach((item, index)=>{
    container.innerHTML += `
      <div class="cart-card">
        <img src="${item.img}" alt="${item.name}">
        <div style="flex:1">
          <b>${item.name}</b><br>$${item.price} 
          <div class="qty-control">
            <button onclick="changeQty(${index},-1)">-</button>
            ${item.qty}
            <button onclick="changeQty(${index},1)">+</button>
          </div>
        </div>
        <button onclick="removeItem(${index})">❌</button>
      </div>
    `;
  });
  updateTotal();
}

// ===== Cantidad / Eliminar =====
function changeQty(i, delta){
  cart[i].qty += delta;
  if(cart[i].qty<1) cart[i].qty=1;
  localStorage.setItem("cart",JSON.stringify(cart));
  renderCart();
}

function removeItem(i){
  cart.splice(i,1);
  localStorage.setItem("cart",JSON.stringify(cart));
  renderCart();
}

// ===== Total =====
function updateTotal(){
  const total = cart.reduce((sum,i)=>sum+i.price*i.qty,0);
  document.getElementById("cartTotal").innerText = "Total: $" + total;
}

// ===== Volver a tienda =====
function goBack(){location.href="index.html"}

// ===== Enviar pedido a Firebase + WhatsApp =====
async function sendOrder(){
  if(cart.length===0){alert("El carrito está vacío!"); return;}
  try{
    const docRef = await db.collection("pedidos").add({
      items: cart,
      total: cart.reduce((sum,i)=>sum+i.price*i.qty,0),
      fecha: new Date()
    });
    localStorage.setItem("cart", JSON.stringify([]));
    renderCart();
    const waLink = `https://wa.me/13129348674?text=Nuevo pedido!%0AID:${docRef.id}%0ATotal:$${docRef.data?.total || 0}%0AVer en Firestore`;
    window.open(waLink, "_blank");
  }catch(e){
    console.error("Error al enviar pedido:", e);
    alert("Error al enviar pedido");
  }
}

// ===== Inicializar =====
renderCart();
</script>

</body>
</html>
