<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Carrito</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{background:#000;color:#FFD700;font-family:Arial;padding:15px}
.item{
  background:#111;
  display:flex;
  gap:10px;
  padding:10px;
  border-radius:12px;
  margin-bottom:10px;
}
.item img{width:70px;border-radius:8px}
.qty{
  display:flex;
  gap:10px;
  align-items:center;
}
.qty button{
  background:#FFD700;
  border:none;
  width:30px;
  height:30px;
  border-radius:50%;
}
.total{
  font-size:20px;
  margin-top:15px;
}
button.main{
  width:100%;
  padding:12px;
  border:none;
  border-radius:12px;
  font-weight:bold;
  margin-top:10px;
}
</style>
</head>

<body>
<h2>🛒 Tu carrito</h2>
<div id="list"></div>
<div class="total">Total: $<span id="total">0</span></div>

<button class="main" onclick="back()">⬅ Volver a la tienda</button>
<button class="main" onclick="send()">Enviar por WhatsApp</button>

<script>
let cart=JSON.parse(localStorage.getItem("cart"))||[];

function render(){
  let t=0;
  const d=document.getElementById("list");
  d.innerHTML="";
  cart.forEach((i,idx)=>{
    t+=i.price*i.qty;
    d.innerHTML+=`
    <div class="item">
      <img src="${i.img}">
      <div>
        <b>${i.name}</b><br>$${i.price}
        <div class="qty">
          <button onclick="chg(${idx},-1)">−</button>
          ${i.qty}
          <button onclick="chg(${idx},1)">+</button>
        </div>
      </div>
    </div>`;
  });
  document.getElementById("total").innerText=t.toFixed(2);
  localStorage.setItem("cart",JSON.stringify(cart));
}

function chg(i,n){
  cart[i].qty+=n;
  if(cart[i].qty<=0)cart.splice(i,1);
  render();
}

function send(){
  let m="Pedido Go Shop:%0A";
  cart.forEach(i=>m+=`${i.qty}x ${i.name} $${i.price*i.qty}%0A`);
  window.open("https://wa.me/?text="+m,"_blank");
}
function back(){location.href="index.html"}

render();
</script>
</body>
</html>
