<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Mi Carrito - Go Shop</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
:root{
  --gold:#FFD700;
  --dark:#111;
}
*{box-sizing:border-box}

body{
  background:#000;
  color:#FFD700;
  font-family:Arial, sans-serif;
  margin:0;
  padding:0;
}

/* ===== HEADER ===== */
header{
  position:fixed;
  top:0;
  width:100%;
  background:var(--dark);
  color:var(--gold);
  text-align:center;
  padding:14px;
  z-index:1000;
  font-size:1.8rem;
}

/* ===== MAIN ===== */
main{padding-top:70px;padding-bottom:90px; max-width:900px;margin:auto;}

/* ===== CART ITEMS ===== */
.cart-item{
  display:flex;
  align-items:center;
  background:#222;
  border-radius:10px;
  margin:10px 0;
  padding:10px;
  transition:0.3s;
}
.cart-item img{
  width:80px;
  height:80px;
  object-fit:cover;
  border-radius:8px;
}
.cart-info{
  flex:1;
  margin-left:15px;
}
.cart-info b{display:block;}
.cart-actions{
  display:flex;
  flex-direction:column;
  align-items:center;
}
.cart-actions button{
  background:#000;
  color:var(--gold);
  border:none;
  padding:4px 8px;
  margin:2px;
  border-radius:6px;
  cursor:pointer;
}
.cart-actions span{margin:5px 0;}

/* ===== TOTAL ===== */
.cart-total{
  text-align:center;
  font-size:1.5rem;
  margin-top:20px;
  font-weight:bold;
}

/* ===== BOTONES ===== */
.btn{
  display:block;
  width:200px;
  margin:20px auto;
  padding:12px;
  background:#000;
  color:var(--gold);
  border:none;
  border-radius:10px;
  cursor:pointer;
  font-weight:bold;
  font-size:1rem;
}
.btn:hover{background:#222;}

/* ===== RESPONSIVE ===== */
@media screen and (max-width:600px){
  .cart-item{flex-direction:column;align-items:flex-start;}
  .cart-item img{width:100%; height:auto;}
  .cart-actions{flex-direction:row;margin-top:10px;}
}
</style>
</head>
<body>

<header>Mi Carrito</header>

<main>
  <div id="cartContainer"></div>
  <div class="cart-total">Total: $<span id="totalPrice">0</span></div>
  <button class="btn" onclick="goBack()">← Regresar a la tienda</button>
  <button class="btn" onclick="sendWhatsApp()">Enviar Pedido por WhatsApp</button>
</main>

<script>
let cart = JSON.parse(localStorage.getItem("cart"))||[];

// ===== RENDER CART =====
function renderCart(){
  const container = document.getElementById("cartContainer");
  container.innerHTML="";
  let total=0;

  cart.forEach((item,index)=>{
    total+=item.price*item.qty;
    const div=document.createElement("div");
    div.className="cart-item";
    div.innerHTML=`
      <img src="${item.img}" alt="${item.name}">
      <div class="cart-info">
        <b>${item.name}</b>
        Precio: $${item.price.toFixed(2)}
      </div>
      <div class="cart-actions">
        <button onclick="decreaseQty(${index})">-</button>
        <span>${item.qty}</span>
        <button onclick="increaseQty(${index})">+</button>
      </div>
    `;
    container.appendChild(div);
  });

  document.getElementById("totalPrice").innerText = total.toFixed(2);
  localStorage.setItem("cart",JSON.stringify(cart));
}

// ===== QUANTITY HANDLERS =====
function increaseQty(i){
  cart[i].qty++;
  renderCart();
}
function decreaseQty(i){
  if(cart[i].qty>1) cart[i].qty--;
  else cart.splice(i,1);
  renderCart();
}

// ===== BOTONES =====
function goBack(){
  window.location.href="index.html";
}

// ===== WHATSAPP =====
function sendWhatsApp(){
  if(cart.length===0){alert("El carrito está vacío"); return;}
  let msg="Hola! Este es mi pedido:%0A";
  cart.forEach(item=>{
    msg+=`- ${item.name} x${item.qty} = $${(item.price*item.qty).toFixed(2)}%0A`;
  });
  const total=cart.reduce((a,b)=>a+b.price*b.qty,0);
  msg+=`Total: $${total.toFixed(2)}`;
  window.open(`https://wa.me/13129348674?text=${msg}`,"_blank");
}

// ===== INICIALIZAR =====
renderCart();
</script>

</body>
</html>
