<!DOCTYPE html>
<html lang="es">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi Carrito - Go Shop</title>
<style>
:root{
  --primary:#800000;
  --dark:#111;
  --bg:#000;
  --card-bg:#2c0000;
}
body{
  background:var(--bg);
  color:#fff;
  font-family:Arial,sans-serif;
  margin:0;
  padding:0;
}
header{
  background:var(--dark);
  color:var(--primary);
  text-align:center;
  padding:15px;
  font-size:1.8rem;
}
.cart-page{
  padding:20px;
  max-width:900px;
  margin:0 auto;
  padding-top:90px;
}
.cart-item{
  display:flex;
  align-items:center;
  justify-content:space-between;
  background:var(--card-bg);
  margin-bottom:15px;
  padding:10px;
  border-radius:10px;
  flex-wrap:wrap;
}
.cart-item img{
  width:100px;
  height:100px;
  object-fit:cover;
  border-radius:10px;
}
.cart-item .info{
  flex:1;
  margin-left:15px;
}
.qty-btn{
  padding:4px 8px;
  margin:0 4px;
  background:#000;
  color:var(--primary);
  border:none;
  border-radius:5px;
  cursor:pointer;
}
.remove-btn{
  background:#000;
  color:var(--primary);
  border:none;
  padding:6px 10px;
  border-radius:6px;
  cursor:pointer;
}
.cart-total{
  font-size:1.5rem;
  font-weight:bold;
  margin-top:20px;
}
.btn-actions{
  display:flex;
  justify-content:center;
  gap:15px;
  margin-top:20px;
  flex-wrap:wrap;
}
.btn-actions button{
  padding:10px 20px;
  background:#000;
  color:var(--primary);
  border:none;
  border-radius:10px;
  font-weight:bold;
  cursor:pointer;
}
.btn-actions button:hover{
  background:#2c0000;
}
</style>
</head>
<body>

<header>Mi Carrito</header>

<section class="cart-page">
  <div id="cart-container"></div>

  <div class="cart-total">
    Subtotal: $<span id="cart-subtotal">0</span><br>
    Envío: $0<br>
    <b>Total: $<span id="cart-total">0</span></b>
  </div>

  <div class="btn-actions">
    <button onclick="goBack()">← Regresar a la tienda</button>
    <button onclick="sendOrder()">Enviar Pedido WhatsApp</button>
  </div>
</section>

<script>
let cart = JSON.parse(localStorage.getItem('cart')) || [];

// ====== PRECIO MAYOREO POR TOTAL ======
function getTotalPriceWithMayoreo(){
  const totalQty = cart.reduce((a,b)=>a+b.qty,0);
  let subtotal = 0;
  cart.forEach(item=>{
    let price = item.price;
    subtotal += price * item.qty;
  });

  // Descuento por mayoreo según cantidad total
  if(totalQty >= 10) subtotal *= 0.8; // 20% de descuento si hay 10 o más items
  else if(totalQty >= 5) subtotal *= 0.9; // 10% de descuento si hay 5 o más items
  return subtotal;
}
