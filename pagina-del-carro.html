<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Mi Carrito - Go Shop</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
:root{
  --gold:#FFD700;
  --dark:#111;
}
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif;}
body{background:#000;color:#fff;overflow-x:hidden;}

/* ===== HEADER ===== */
header{
  background:var(--dark);
  color:var(--gold);
  display:flex;
  justify-content:center;
  align-items:center;
  padding:15px;
  position:fixed;
  top:0;
  width:100%;
  z-index:1000;
}
header h1{font-size:1.8rem;}
.cart-btn{
  position:absolute;
  right:15px;
  font-size:24px;
  cursor:pointer;
}
.cart-btn span{
  background:#000;
  padding:2px 6px;
  border-radius:50%;
  font-size:12px;
}

/* ===== MAIN ===== */
main{padding-top:80px;padding-bottom:20px;}
.cart-page{
  max-width:600px;
  margin:auto;
  padding:10px;
}
.cart-item{
  display:flex;
  align-items:center;
  background:#222;
  border-radius:12px;
  padding:10px;
  margin-bottom:12px;
  animation:fadeUp 0.4s ease;
}
.cart-item img{
  width:90px;
  height:90px;
  object-fit:cover;
  border-radius:10px;
}
.item-info{
  flex:1;
  margin-left:10px;
  text-align:left;
}
.item-info p{name:none;}
.qty-control{
  display:flex;
  align-items:center;
  gap:6px;
  margin-top:6px;
}
.qty-control button{
  padding:4px 8px;
  border:none;
  border-radius:6px;
  background:#000;
  color:var(--gold);
  font-weight:bold;
  cursor:pointer;
}
.remove-btn{
  background:#000;
  border:none;
  color:var(--gold);
  padding:6px 10px;
  border-radius:6px;
  cursor:pointer;
}

/* ===== TOTAL ===== */
.cart-total{
  text-align:center;
  font-size:20px;
  font-weight:bold;
  margin-top:15px;
}
.btn-actions{
  display:flex;
  justify-content:space-around;
  margin-top:15px;
}
.btn-actions button{
  padding:10px 15px;
  border:none;
  border-radius:10px;
  font-weight:bold;
  cursor:pointer;
}
.btn-back{background:#000;color:var(--gold);}
.btn-wa{background:var(--gold);color:#000;}

/* ===== ANIMACIONES ===== */
@keyframes fadeUp{
  from{opacity:0;transform:translateY(15px);}
  to{opacity:1;transform:translateY(0);}
}
</style>
</head>
<body>

<header>
  <h1>Mi Carrito</h1>
</header>

<main>
  <section class="cart-page" id="cart-page">
    <!-- Productos del carrito se insertarán aquí -->
  </section>

  <div class="cart-total">
    Total: $<span id="cart-total">0.00</span>
  </div>

  <div class="btn-actions">
    <button class="btn-back" onclick="backToShop()">⬅ Volver a la tienda</button>
    <button class="btn-wa" onclick="sendWhatsApp()">Enviar pedido</button>
  </div>
</main>

<script>
// ===== VARIABLES =====
let cartItems = JSON.parse(localStorage.getItem("cart")) || [];

// ===== RENDER DEL CARRITO =====
function renderCart(){
  const container = document.getElementById("cart-page");
  container.innerHTML="";
  let total=0;

  cartItems.forEach((item,index)=>{
    const div = document.createElement("div");
    div.classList.add("cart-item");
    div.innerHTML=`
      <img src="${item.img}" alt="${item.name}">
      <div class="item-info">
        <p><b>${item.name}</b></p>
        <p>$${item.price.toFixed(2)}</p>
        <div class="qty-control">
          <button onclick="changeQty(${index},-1)">-</button>
          <span id="qty-${index}">${item.qty}</span>
          <button onclick="changeQty(${index},1)">+</button>
        </div>
      </div>
      <button class="remove-btn" onclick="removeItem(${index})">X</button>
    `;
    container.appendChild(div);
    total += item.price * item.qty;
  });

  document.getElementById("cart-total").innerText=total.toFixed(2);
}

// ===== FUNCIONES =====
function changeQty(idx,delta){
  cartItems[idx].qty+=delta;
  if(cartItems[idx].qty<1) cartItems[idx].qty=1;
  localStorage.setItem("cart",JSON.stringify(cartItems));
  renderCart();
}

function removeItem(idx){
  cartItems.splice(idx,1);
  localStorage.setItem("cart",JSON.stringify(cartItems));
  renderCart();
}

function backToShop(){window.location.href="index.html";}

function sendWhatsApp(){
  if(cartItems.length===0){alert("El carrito está vacío."); return;}
  const base="https://wa.me/13129348674?text=";
  let text="Pedido de Go Shop:%0A";
  cartItems.forEach(item=>{
    text+=`${item.name} x${item.qty} - $${(item.price*item.qty).toFixed(2)}%0A`;
  });
  const total=document.getElementById("cart-total").innerText;
  text+=`Total: $${total}%0A`;
  text+=`Link del carrito: ${window.location.href}`;
  window.open(base+text,"_blank");
}

// ===== INICIALIZAR =====
renderCart();
</script>

</body>
</html>
