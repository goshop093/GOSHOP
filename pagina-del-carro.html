<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi Carrito - Go Shop</title>
<style>
:root{
  --primary:#800000; /* color vino */
  --dark:#111;
  --bg:#000;
  --card-bg:#2c0000;
}
body{
  background:var(--bg);
  color:#fff;
  font-family:Arial,sans-serif;
  margin:0;
  padding:0;
}
header{
  background:var(--dark);
  color:var(--primary);
  text-align:center;
  padding:15px;
  font-size:1.8rem;
}
.cart-page{
  padding:20px;
  max-width:900px;
  margin:0 auto;
  padding-top:90px;
}
.cart-item{
  display:flex;
  align-items:center;
  background:var(--card-bg);
  margin-bottom:15px;
  padding:10px;
  border-radius:10px;
  gap:15px;
  flex-wrap:wrap;
}
.cart-item img{
  width:80px;
  height:80px;
  object-fit:cover;
  border-radius:10px;
}
.cart-item .info{
  flex:1;
}
.cart-item .info p{
  margin:4px 0;
}
.qty-btn{
  padding:4px 8px;
  margin:0 4px;
  background:#000;
  color:var(--primary);
  border:none;
  border-radius:5px;
  cursor:pointer;
}
.remove-btn{
  background:#000;
  color:var(--primary);
  border:none;
  padding:6px 10px;
  border-radius:6px;
  cursor:pointer;
}
.cart-total{
  font-size:1.5rem;
  font-weight:bold;
  margin-top:20px;
}
.btn-actions{
  display:flex;
  justify-content:center;
  gap:15px;
  margin-top:20px;
  flex-wrap:wrap;
}
.btn-actions button{
  padding:10px 20px;
  background:#000;
  color:var(--primary);
  border:none;
  border-radius:10px;
  font-weight:bold;
  cursor:pointer;
}
.btn-actions button:hover{
  background:#2c0000;
}
@media screen and (max-width:600px){
  .cart-item{
    flex-direction:column;
    align-items:flex-start;
  }
  .cart-item img{
    width:100%;
    height:auto;
  }
}
</style>
</head>
<body>

<header>Mi Carrito</header>

<section class="cart-page">
  <div id="cart-container"></div>

  <div class="cart-total">
    Subtotal: $<span id="cart-subtotal">0</span><br>
    Envío: $0<br>
    <b>Total: $<span id="cart-total">0</span></b>
  </div>

  <div class="btn-actions">
    <button onclick="goBack()">← Regresar a la tienda</button>
    <button onclick="sendOrder()">Enviar Pedido WhatsApp</button>
  </div>
</section>

<script>
let cart = JSON.parse(localStorage.getItem('cart')) || [];

// ====== PRECIO MAYOREO POR TOTAL ======
function getTotalPriceWithMayoreo(){
  const totalQty = cart.reduce((a,b)=>a+b.qty,0);
  let subtotal = 0;
  cart.forEach(item=>{
    subtotal += item.price * item.qty;
  });

  // Descuento por mayoreo según cantidad total
  if(totalQty >= 10) subtotal *= 0.8; // 20% de descuento si hay 10 o más items
  else if(totalQty >= 5) subtotal *= 0.9; // 10% de descuento si hay 5 o más items
  return subtotal;
}

// ====== RENDER CARRITO ======
function updateCart(){
  const container = document.getElementById('cart-container');
  const subtotalSpan = document.getElementById('cart-subtotal');
  const totalSpan = document.getElementById('cart-total');
  container.innerHTML = '';

  cart.forEach((item,index)=>{
    const div = document.createElement('div');
    div.className = 'cart-item';
    div.innerHTML = `
      <img src="${item.img}" alt="${item.name}">
      <div class="info">
        <p><b>${item.name}</b></p>
        <p>Precio unitario: $${item.price.toFixed(2)}</p>
        <p>
          Cantidad: 
          <button class="qty-btn" onclick="changeQty(${index},-1)">-</button>
          ${item.qty}
          <button class="qty-btn" onclick="changeQty(${index},1)">+</button>
        </p>
        <p>Total: $${(item.price*item.qty).toFixed(2)}</p>
      </div>
      <button class="remove-btn" onclick="removeItem(${index})">X</button>
    `;
    container.appendChild(div);
  });

  const subtotal = getTotalPriceWithMayoreo();
  subtotalSpan.textContent = subtotal.toFixed(2);
  totalSpan.textContent = subtotal.toFixed(2);

  localStorage.setItem('cart',JSON.stringify(cart));
}

// ====== CANTIDAD + / - ======
function changeQty(index,delta){
  cart[index].qty += delta;
  if(cart[index].qty<1) cart[index].qty=1;
  updateCart();
}

// ====== ELIMINAR ======
function removeItem(index){
  cart.splice(index,1);
  updateCart();
}

// ====== REGRESAR ======
function goBack(){window.location.href='index.html';}

// ====== WHATSAPP ======
function sendOrder(){
  if(cart.length===0){alert('El carrito está vacío'); return;}
  let msg = 'Pedido Go Shop:\n';
  cart.forEach(i=>{
    msg += `${i.name} x${i.qty} = $${(i.price*i.qty).toFixed(2)}\n`;
  });
  const total = getTotalPriceWithMayoreo().toFixed(2);
  msg += `Total: $${total}`;
  const waNumber = '13129348674';
  const url = `https://api.whatsapp.com/send?phone=${waNumber}&text=${encodeURIComponent(msg)}`;
  window.open(url,'_blank');
}

// ====== INICIALIZAR ======
updateCart();
</script>

</body>
</html>
