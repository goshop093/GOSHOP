<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi Carrito - Go Shop</title>
<style>
:root{--gold:#FFD700;--dark:#111;}
body{background:#000;color:#fff;font-family:Arial,sans-serif;margin:0;padding:0;}
header{position:fixed;top:0;width:100%;background:var(--dark);color:var(--gold);display:flex;justify-content:center;align-items:center;padding:14px;z-index:1000;}
.cart-count{position:absolute;right:15px;background:#000;padding:2px 6px;border-radius:50%;font-size:12px;}
main{padding-top:80px;padding-bottom:80px;}
.cart-page{max-width:900px;margin:20px auto;padding:20px;background:var(--dark);border-radius:15px;color:var(--gold);}
.cart-item-page{display:flex;align-items:center;background:#222;padding:12px;margin-bottom:12px;border-radius:10px;}
.cart-item-page img{width:100px;height:100px;object-fit:cover;border-radius:10px;margin-right:10px;}
.cart-item-page .info{flex:1;text-align:left;}
.cart-item-page .info p{margin:2px 0;}
.remove-btn-page{background:#000;color:var(--gold);border:none;padding:6px 10px;border-radius:6px;cursor:pointer;}
.remove-btn-page:hover{background:#222;}
.cart-total-page{text-align:center;font-size:20px;font-weight:bold;margin-top:15px;}
.btn-clear-cart,.btn-whatsapp,.btn-back{display:block;margin:15px auto;padding:12px 20px;background:#000;color:var(--gold);border-radius:10px;border:none;cursor:pointer;font-weight:bold;}
.btn-clear-cart:hover,.btn-whatsapp:hover,.btn-back:hover{background:#222;}
</style>
</head>
<body>

<header>
  <h1>Mi Carrito</h1>
  <div class="cart-count" id="cart-count">0</div>
</header>

<main>
  <section class="cart-page">
    <div id="cart-items-container"></div>
    <div class="cart-total-page">Total: $<span id="cart-total-page">0.00</span></div>
    <button class="btn-clear-cart" id="clear-cart">Vaciar Carrito</button>
    <button class="btn-whatsapp" id="send-whatsapp">Enviar Link del Carrito por WhatsApp</button>
    <button class="btn-back" onclick="location.href='index.html'">Volver a la Tienda</button>
  </section>
</main>

<script>
// ====== CART ======
let cart = JSON.parse(localStorage.getItem("cart")) || [];

// ====== FUNCIONES ======
function updateCartCount(){
  document.getElementById("cart-count").textContent = cart.length;
}

function displayCart(){
  const container = document.getElementById("cart-items-container");
  const totalSpan = document.getElementById("cart-total-page");
  container.innerHTML = "";
  let total = 0;
  cart.forEach((item,index)=>{
    const div = document.createElement("div");
    div.classList.add("cart-item-page");
    div.innerHTML = `
      <img src="${item.img}" alt="${item.name}">
      <div class="info">
        <p>${item.name}</p>
        <p>Cantidad: <span id="qty-${index}">${item.qty}</span></p>
        <p>Precio: $${(item.price*item.qty).toFixed(2)}</p>
      </div>
      <div>
        <button onclick="changeQty(${index},1)">+</button>
        <button onclick="changeQty(${index},-1)">-</button>
        <button class="remove-btn-page" onclick="removeItem(${index})">X</button>
      </div>
    `;
    container.appendChild(div);
    total += item.price*item.qty;
  });
  totalSpan.textContent = total.toFixed(2);
}

function changeQty(i,delta){
  cart[i].qty += delta;
  if(cart[i].qty<1) cart[i].qty=1;
  localStorage.setItem("cart",JSON.stringify(cart));
  displayCart();
  updateCartCount();
}

function removeItem(i){
  cart.splice(i,1);
  localStorage.setItem("cart",JSON.stringify(cart));
  displayCart();
  updateCartCount();
}

document.getElementById("clear-cart").addEventListener("click",()=>{
  cart = [];
  localStorage.setItem("cart",JSON.stringify(cart));
  displayCart();
  updateCartCount();
});

// ====== ENVIAR LINK DE WHATSAPP ======
document.getElementById("send-whatsapp").addEventListener("click",()=>{
  if(cart.length===0){ alert("El carrito está vacío"); return; }
  const carritoLink = encodeURIComponent(window.location.href);
  window.open(`https://wa.me/13129348674?text=Mi%20pedido%20está%20aquí:%20${carritoLink}`,"_blank");
});

// ====== INICIALIZAR ======
updateCartCount();
displayCart();
</script>

</body>
</html>
