<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carrito - Go Shop</title>

<style>
body{background:#000;color:#FFD700;font-family:Arial;text-align:center;margin:0}
.cart{max-width:900px;margin:30px auto;background:#111;padding:20px;border-radius:15px}
.item{display:flex;gap:15px;background:#222;padding:15px;border-radius:10px;margin-bottom:15px}
.item img{width:100px;border-radius:10px}
button,a{padding:12px 20px;border-radius:10px;font-weight:bold;border:none;cursor:pointer;text-decoration:none}
.clear{background:#000;color:#FFD700}
.back{background:#FFD700;color:#000}
.whatsapp{background:#25D366;color:#000}
</style>
</head>

<body>

<h1>Mi Carrito</h1>

<div class="cart" id="cart"></div>
<h2>Total: $<span id="total">0</span></h2>

<button class="clear" onclick="clearCart()">Vaciar carrito</button><br><br>
<a href="index.html" class="back">⬅ Regresar a la tienda</a><br><br>
<a href="https://chat.whatsapp.com/EyDTR5Yg9LF7RSJyAUYIWX?mode=gi_t" target="_blank" class="whatsapp">💬 WhatsApp</a>

<script>
let cartItems=JSON.parse(localStorage.getItem("cartItems"))||[];

function render(){
const c=document.getElementById("cart");
c.innerHTML="";
let t=0;
cartItems.forEach((p,i)=>{
c.innerHTML+=`<div class="item">
<img src="${p.img}">
<div style="flex:1;text-align:left">
<strong>${p.name}</strong><br>$${p.price}
</div>
<button onclick="remove(${i})">X</button>
</div>`;
t+=p.price;
});
document.getElementById("total").textContent=t.toFixed(2);
}

function remove(i){
cartItems.splice(i,1);
localStorage.setItem("cartItems",JSON.stringify(cartItems));
render();
}
function clearCart(){
cartItems=[];
localStorage.setItem("cartItems",JSON.stringify(cartItems));
render();
}

render();
</script>

</body>
</html>
