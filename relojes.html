<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Relojes de Lujo - Go Shop</title>
<style>
:root{
  --primary:#800000;
  --dark:#111;
  --bg:#000;
  --text:#fff;
}
*{box-sizing:border-box;}
body{background:var(--bg);color:var(--text);font-family:Arial,sans-serif;margin:0;padding:0;overflow-x:hidden;}
button{cursor:pointer;transition:.3s;}
button:hover{opacity:0.8;}
header{
  background:var(--dark);
  color:var(--primary);
  display:flex;
  justify-content:center;
  align-items:center;
  padding:14px;
  position:fixed;
  top:0;
  width:100%;
  z-index:1000;
  font-size:1.8rem;
}
header b{flex:1;text-align:center;}
.products{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:15px;padding:10px;margin-top:80px;}
.card{
  background:var(--dark);
  color:#fff;
  border-radius:16px;
  padding:10px;
  text-align:center;
}
.card img{width:100%;border-radius:10px;}
.card input, .card button{width:100%;margin-top:5px;padding:8px;border-radius:8px;border:none;font-weight:bold;}
.card input{background:#222;color:#fff;}
.card button{background:var(--primary);color:#fff;cursor:pointer;}
.mobile-bar{
  position:fixed;
  bottom:0;
  width:100%;
  background:var(--dark);
  display:flex;
  justify-content:space-around;
  padding:10px 0;
}
.mobile-bar button{background:none;border:none;color:var(--primary);font-size:20px;}
</style>
</head>
<body>

<header>
  <b>Go Shop - Relojes de Lujo</b>
</header>

<main id="products" class="products"></main>

<div class="mobile-bar">
  <button onclick="location.href='index.html'">🏠</button>
  <button onclick="goCart()">🛒</button>
  <button onclick="openWA()">💬</button>
</div>

<script>
// ===== Datos relojes =====
const watches = [
  {name:"Rolex Submariner", img:"images/watch1.jpg"},
  {name:"Rolex Daytona", img:"images/watch2.jpg"},
  {name:"Rolex GMT Master II", img:"images/watch3.jpg"},
  {name:"Rolex Yacht Master", img:"images/watch4.jpg"},
  {name:"Rolex Datejust", img:"images/watch5.jpg"},
  {name:"Omega Seamaster", img:"images/watch6.jpg"},
  {name:"Omega Constellation", img:"images/watch7.jpg"},
  {name:"Omega Speedmaster", img:"images/watch8.jpg"},
  {name:"Omega De Ville", img:"images/watch9.jpg"},
  {name:"Omega Planet Ocean", img:"images/watch10.jpg"},
  {name:"Tag Heuer Carrera", img:"images/watch11.jpg"},
  {name:"Tag Heuer Monaco", img:"images/watch12.jpg"},
  {name:"Tag Heuer Aquaracer", img:"images/watch13.jpg"},
  {name:"Tag Heuer Formula 1", img:"images/watch14.jpg"},
  {name:"Tag Heuer Link", img:"images/watch15.jpg"},
  {name:"Audemars Piguet Royal Oak", img:"images/watch16.jpg"},
  {name:"Audemars Piguet Royal Oak Offshore", img:"images/watch17.jpg"},
  {name:"Audemars Piguet Jules Audemars", img:"images/watch18.jpg"},
  {name:"Audemars Piguet Code 11.59", img:"images/watch19.jpg"},
  {name:"Audemars Piguet Royal Oak Concept", img:"images/watch20.jpg"},
  {name:"Cartier Santos", img:"images/watch21.jpg"},
  {name:"Cartier Ballon Bleu", img:"images/watch22.jpg"},
  {name:"Cartier Tank", img:"images/watch23.jpg"},
  {name:"Cartier Rotonde", img:"images/watch24.jpg"},
  {name:"Cartier Pasha", img:"images/watch25.jpg"},
  {name:"Hublot Big Bang", img:"images/watch26.jpg"},
  {name:"Hublot Classic Fusion", img:"images/watch27.jpg"},
  {name:"Hublot Spirit of Big Bang", img:"images/watch28.jpg"},
  {name:"Hublot MP-11", img:"images/watch29.jpg"},
  {name:"Hublot Aero Bang", img:"images/watch30.jpg"},
  {name:"Patek Philippe Nautilus", img:"images/watch31.jpg"},
  {name:"Patek Philippe Aquanaut", img:"images/watch32.jpg"},
  {name:"Patek Philippe Calatrava", img:"images/watch33.jpg"},
  {name:"Patek Philippe Complications", img:"images/watch34.jpg"},
  {name:"Patek Philippe Grand Complications", img:"images/watch35.jpg"},
  {name:"IWC Portugieser", img:"images/watch36.jpg"},
  {name:"IWC Pilot Watch", img:"images/watch37.jpg"},
  {name:"IWC Aquatimer", img:"images/watch38.jpg"},
  {name:"IWC Da Vinci", img:"images/watch39.jpg"},
  {name:"IWC Portofino", img:"images/watch40.jpg"},
  {name:"Panerai Luminor", img:"images/watch41.jpg"},
  {name:"Panerai Radiomir", img:"images/watch42.jpg"},
  {name:"Panerai Submersible", img:"images/watch43.jpg"},
  {name:"Panerai Pegaso", img:"images/watch44.jpg"},
  {name:"Panerai Special Edition", img:"images/watch45.jpg"},
  {name:"Jacob & Co Epic", img:"images/watch46.jpg"},
  {name:"Jacob & Co Billionaire", img:"images/watch47.jpg"},
  {name:"Blancpain Fifty Fathoms", img:"images/watch48.jpg"},
  {name:"Vacheron Constantin Overseas", img:"images/watch49.jpg"},
  {name:"Breguet Classique", img:"images/watch50.jpg"}
];

// ===== Carrito =====
let cart = JSON.parse(localStorage.getItem("cart")) || [];

// ===== Render relojes =====
function renderWatches(){
  const container = document.getElementById("products");
  container.innerHTML = "";
  watches.forEach((w,i)=>{
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `
      <img src="${w.img}" alt="${w.name}">
      <b>${w.name}</b>
      <input type="number" id="qty-${i}" min="1" value="1" placeholder="Cantidad">
      <b>$5000</b>
      <button onclick='addToCart(${i})'>Agregar</button>
    `;
    container.appendChild(card);
  });
}

// ===== Agregar al carrito =====
function addToCart(index){
  const qtyInput = document.getElementById(`qty-${index}`);
  const qty = parseInt(qtyInput.value);
  if(qty < 1){ alert("Cantidad inválida"); return; }

  const item = {...watches[index], price:5000, qty};
  const existing = cart.find(p => p.name===item.name);
  if(existing){
    existing.qty += qty;
  } else {
    cart.push(item);
  }

  localStorage.setItem("cart", JSON.stringify(cart));
  updateCount();
}

// ===== Contador carrito =====
function updateCount(){
  document.getElementById("cartCount") ? 
    document.getElementById("cartCount").innerText = cart.reduce((a,b)=>a+b.qty,0) 
    : null;
}

// ===== Funciones extras =====
function goCart(){ location.href="pagina-del-carro.html"; }
function openWA(){ window.open("https://wa.me/13129348674","_blank"); }

// ===== Inicializar =====
renderWatches();
updateCount();
</script>

</body>
</html>
