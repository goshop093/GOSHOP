<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Perfumes - Go Shop</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <div class="menu-btn" onclick="toggleMenu()">☰</div>
  <b>Perfumes</b>
  <div class="cart-btn" onclick="goCart()">🛒 <span id="cartCount">0</span></div>
</header>

<main style="padding-top:80px; padding-bottom:80px;">

  <h2>Perfumes Exclusivos</h2>
  <div class="products" id="products"></div>

</main>

<div class="mobile-bar">
  <button onclick="location.href='index.html'">🏠</button>
  <button onclick="goCart()">🛒</button>
  <button onclick="openWA()">💬</button>
</div>

<script>
// ====== DATOS DE PERFUMES (ejemplo 10, puedes agregar hasta 100+) ======
const data = [
  {name:"Valentino Uomo", price:80, img:"images/perfume44.jpg"},
  {name:"Valentino Donna Born in Roma", price:80, img:"images/perfume21.jpg"},
  {name:"Dior J’adore", price:80, img:"images/perfume18.jpg"},
  {name:"Creed Aventus", price:80, img:"images/perfume6.jpg"},
  {name:"Tom Ford Lost Cherry", price:80, img:"images/perfume33.jpg"},
  {name:"Versace Eros", price:80, img:"images/perfume40.jpg"},
  {name:"Gucci Bloom", price:80, img:"images/perfume39.jpg"},
  {name:"YSL Libre", price:80, img:"images/perfume42.jpg"},
  {name:"Bleu De Chanel Parfum", price:80, img:"images/perfume29.jpg"},
  {name:"One Million", price:80, img:"images/perfume27.jpg"}
];

// ====== CARRITO ======
let cart = JSON.parse(localStorage.getItem("cart")) || [];

function updateCount(){
  document.getElementById("cartCount").innerText = cart.reduce((s,p)=>s+p.qty||1,0);
}

// ====== RENDER PERFUMES ======
function render(){
  const container = document.getElementById("products");
  container.innerHTML = "";
  data.forEach(i=>{
    const card = document.createElement("div");
    card.className = "product-card";
    card.innerHTML = `
      <img src="${i.img}" alt="${i.name}">
      <h3>${i.name}</h3>
      <p>$${i.price}</p>
      <button onclick='addCart(${JSON.stringify(i)})'>Agregar</button>
    `;
    container.appendChild(card);
  });
}

// ====== AGREGAR AL CARRITO ======
function addCart(item){
  const index = cart.findIndex(p=>p.name===item.name);
  if(index!==-1) cart[index].qty++;
  else cart.push({...item, qty:1});
  localStorage.setItem("cart",JSON.stringify(cart));
  updateCount();
  alert(`${item.name} agregado al carrito`);
}

// ====== FUNCIÓN CARRITO Y WA ======
function goCart(){location.href='pagina-del-carro.html'}
function openWA(){window.open("https://wa.me/13129348674","_blank")}

// ====== INICIALIZAR ======
render();
updateCount();
</script>

</body>
</html>
